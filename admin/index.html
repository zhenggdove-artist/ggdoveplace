<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager — GGdove</title>
  <!-- 允許 blob: URL 被 fetch/XHR 讀取（圖片上傳必要）-->
  <meta http-equiv="Content-Security-Policy" content="
    default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
    connect-src * data: blob:;
    img-src     * data: blob:;
    media-src   * data: blob:;
    worker-src  blob: *;
    font-src    * data:;
  ">
  <style>
    /* ── CMS 工作流說明橫幅 ── */
    #cms-workflow-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
      background: #1a0e2e; border-bottom: 2px solid #7755ff;
      padding: 0.45rem 1.2rem; display: flex; align-items: center;
      gap: 1.2rem; font-family: 'Courier New', monospace; font-size: 0.72rem;
      color: #c8c0e8; letter-spacing: 0.04em; pointer-events: none;
    }
    #cms-workflow-banner .wf-save  { color: #55ddaa; font-weight: bold; }
    #cms-workflow-banner .wf-pub   { color: #ff9944; font-weight: bold; }
    #cms-workflow-banner .wf-sep   { color: #3a2860; }
    #cms-workflow-banner .wf-note  { color: #6a6080; }
    /* 推開 Decap CMS 本體以免被橫幅遮住 */
    #nc-root { margin-top: 34px !important; }
  </style>
</head>
<body>
  <!-- 工作流提示橫幅 -->
  <div id="cms-workflow-banner">
    <span class="wf-save">💾 Save = 直接推送上線</span>
    <span class="wf-sep">│</span>
    <span class="wf-note">儲存後網站約 1–2 分鐘重建完成</span>
    <span class="wf-sep">│</span>
    <span class="wf-note">圖片上傳後點 Save 即生效，無需額外步驟</span>
    <span class="wf-sep">│</span>
    <span id="cms-auth-status" style="color:#6a6080;pointer-events:auto;cursor:default;">⏳ 連線中...</span>
  </div>

  <script>
  // ── 1. 持續偵測 GitHub API Token 是否有效
  (function testGitHubToken() {
    var statusEl = document.getElementById('cms-auth-status');
    var verified = false;
    var pollTimer = null;

    function setStatus(msg, color, clickable) {
      statusEl.textContent = msg;
      statusEl.style.color = color || '#6a6080';
      statusEl.style.pointerEvents = clickable ? 'auto' : 'none';
      statusEl.style.cursor = clickable ? 'pointer' : 'default';
      if (clickable) statusEl.onclick = window.cmsRelogin;
    }

    // 從 localStorage 搜尋 token（支援多種 Decap CMS 儲存格式）
    function findToken() {
      var keys = Object.keys(localStorage);
      for (var i = 0; i < keys.length; i++) {
        var raw = localStorage.getItem(keys[i]);
        // 格式1: JSON 物件 {token: "...", access_token: "..."}
        try {
          var v = JSON.parse(raw);
          if (v && typeof v === 'object') {
            if (v.token && typeof v.token === 'string') return v.token;
            if (v.access_token && typeof v.access_token === 'string') return v.access_token;
          }
        } catch(e) {}
        // 格式2: 純字串 token（gh開頭或40字元hex）
        if (typeof raw === 'string' && /^(gh[opsu]_[A-Za-z0-9_]{36,}|[a-f0-9]{40})$/.test(raw.trim())) {
          return raw.trim();
        }
      }
      return null;
    }

    function checkToken() {
      if (verified) return;
      var token = findToken();
      if (!token) {
        setStatus('⏳ 等待登入...', '#6a6080');
        return; // keep polling
      }

      // 找到 token，驗證是否有效
      fetch('https://api.github.com/repos/zhenggdove-artist/ggdoveplace', {
        headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github.v3+json'
        }
      }).then(function(r) {
        if (r.ok) {
          return r.json().then(function(d) {
            verified = true;
            if (pollTimer) clearInterval(pollTimer);
            var push = d.permissions && d.permissions.push;
            if (push) {
              setStatus('✅ GitHub 認證正常，有寫入權限', '#55ddaa');
            } else {
              setStatus('⚠ 已登入但無寫入權限（push: false）', '#ffaa44');
            }
          });
        } else if (r.status === 401) {
          setStatus('❌ Token 已失效，請點此重新登入', '#ff6688', true);
        } else if (r.status === 403) {
          setStatus('❌ 權限不足 (403)，請點此重新登入', '#ff6688', true);
        } else {
          setStatus('⚠ GitHub API ' + r.status, '#ffaa44');
        }
      }).catch(function(err) {
        setStatus('❌ 無法連接 GitHub API: ' + err.message, '#ff6688', true);
      });
    }

    // 首次 2 秒後開始檢查，之後每 3 秒輪詢直到找到有效 token
    setTimeout(function() {
      checkToken();
      pollTimer = setInterval(checkToken, 3000);
      // 60 秒後如果還沒找到就停止輪詢，顯示提示
      setTimeout(function() {
        if (!verified) {
          clearInterval(pollTimer);
          setStatus('❌ 未找到 Token，請點此重新登入', '#ff6688', true);
        }
      }, 60000);
    }, 2000);
  })();

  // ── 2. Fetch 攔截器：捕捉所有失敗請求，顯示診斷資訊
  //       特別針對 blob: URL 提供 XHR fallback（規避 CSP fetch 限制）
  (function patchFetch() {
    var _orig = window.fetch;

    // blob: URL 專用 XHR fallback
    function fetchBlobViaXHR(url) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'arraybuffer';
        xhr.onload = function() {
          if (xhr.status === 0 || xhr.status === 200) {
            // 猜測 mime type（Decap CMS 通常上傳圖片）
            var ct = xhr.getResponseHeader('Content-Type') || 'application/octet-stream';
            var blob = new Blob([xhr.response], { type: ct });
            resolve(new Response(blob, { status: 200, headers: { 'Content-Type': ct } }));
          } else {
            reject(new TypeError('XHR blob failed: ' + xhr.status));
          }
        };
        xhr.onerror = function() { reject(new TypeError('XHR blob network error')); };
        xhr.send();
      });
    }

    window.fetch = function(input, init) {
      var url = (typeof input === 'string') ? input : (input && input.url) || String(input);

      // blob: URL → 優先嘗試原生 fetch，失敗則用 XHR fallback
      if (typeof url === 'string' && url.startsWith('blob:')) {
        return _orig.apply(this, arguments).catch(function(err) {
          console.warn('[CMS] blob: fetch failed, trying XHR fallback', url, err.message);
          return fetchBlobViaXHR(url);
        });
      }

      // 其他 URL → 捕捉失敗並顯示診斷
      return _orig.apply(this, arguments).catch(function(err) {
        showNetError(url, err.message || 'Failed to fetch');
        throw err;
      });
    };

    function showNetError(url, msg) {
      var el = document.getElementById('cms-net-err');
      if (!el) {
        el = document.createElement('div');
        el.id = 'cms-net-err';
        el.style.cssText = [
          'position:fixed','top:34px','left:0','right:0','z-index:99997',
          'background:#1a0010','border-bottom:2px solid #ff4466',
          'padding:0.5rem 1.2rem','display:flex','align-items:center','gap:0.8rem',
          'font-family:"Courier New",monospace','font-size:0.68rem','color:#ffaaaa',
          'flex-wrap:wrap'
        ].join(';');
        document.body.appendChild(el);
        var r = document.getElementById('nc-root');
        if (r) r.style.marginTop = '70px';
      }
      var short = url
        .replace('https://api.github.com/repos/zhenggdove-artist/ggdoveplace/contents/', '📁 ')
        .replace('https://api.github.com/', 'api.github.com/')
        .replace('https://ggdove-cms-auth.onrender.com', '🔑 render-auth');
      el.innerHTML =
        '<span style="color:#ff6688;font-weight:bold">⚠ 儲存失敗</span>' +
        '<span style="color:#886688"> URL：</span><span style="word-break:break-all">' + short + '</span>' +
        '<span style="color:#886688"> 錯誤：</span><span>' + msg + '</span>' +
        '<button onclick="cmsRelogin()" style="background:#ff4466;color:#fff;border:none;padding:3px 10px;cursor:pointer;font-family:inherit;border-radius:2px;flex-shrink:0">🔄 重新登入</button>' +
        '<button onclick="document.getElementById(\'cms-net-err\').remove()" style="background:none;color:#886688;border:1px solid #553355;padding:3px 8px;cursor:pointer;font-family:inherit;border-radius:2px">✕</button>';
    }
  })();

  // ── 3. 重新登入：清除所有 Decap CMS auth 快取
  window.cmsRelogin = function() {
    var cleared = [];
    Object.keys(localStorage).forEach(function(k) {
      if (/decap|netlify|cms|github|token|auth/i.test(k)) {
        localStorage.removeItem(k);
        cleared.push(k);
      }
    });
    Object.keys(sessionStorage).forEach(function(k) {
      if (/decap|netlify|cms|github|token|auth/i.test(k)) {
        sessionStorage.removeItem(k);
      }
    });
    console.log('Cleared auth keys:', cleared);
    // 先喚醒 Render 服務，等它就緒再刷新
    var status = document.getElementById('cms-auth-status');
    if (status) status.textContent = '⏳ 正在重設認證...';
    setTimeout(function() { window.location.reload(); }, 800);
  };
  </script>

  <script src="https://unpkg.com/decap-cms@3.9.0/dist/decap-cms.js"></script>
  <script>
  // ── Inject site CSS into preview iframe ──
  CMS.registerPreviewStyle(`
    @font-face {
      font-family: 'Saint';
      src: url('/fonts/saint.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  `, { raw: true });
  CMS.registerPreviewStyle('https://zhenggdove-artist.github.io/ggdoveplace/css/style.css');
  CMS.registerPreviewStyle([
    ':root{--bg:#06030f;--bg-2:#0d0820;--bg-3:#110d28;',
    '--text:#c8c0e8;--text-bright:#eee8ff;--text-dim:#6a6080;',
    '--accent:#7755ff;--accent-dim:#4433bb;--accent-glow:rgba(120,90,255,0.35);',
    '--border:#1e1840;--serif:"Georgia",serif;--mono:"Courier New",monospace;}',
    'body{background:var(--bg);color:var(--text);font-family:var(--serif);margin:0;padding:1rem 2rem;}',
    'h2.page-title{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.25em;',
    'text-transform:uppercase;color:var(--text-dim);margin:1.5rem 0 1.2rem;font-weight:400;}'
  ].join(''), { raw: true });

  // ── Zalgo engine (for CMS preview) ──────────────────────
  var ZU = ['\u030d','\u030e','\u0304','\u0305','\u033f','\u0311','\u0306','\u0310','\u0352','\u0357','\u0351','\u0307','\u0308','\u030a','\u0342','\u0343','\u0344','\u034a','\u034b','\u034c','\u0303','\u0302','\u030c','\u0350','\u0300','\u0301','\u030b','\u030f','\u0312','\u0313','\u0314','\u033d','\u0309','\u0363','\u0364','\u0365','\u0366','\u0367','\u0368','\u0369','\u036a','\u036b','\u036c','\u036d','\u036e','\u036f','\u033e','\u035b','\u0346','\u031a'];
  var ZM = ['\u0315','\u031b','\u0340','\u0341','\u0358','\u0321','\u0322','\u0327','\u0328','\u0334','\u0335','\u0336','\u034f','\u035c','\u035d','\u035e','\u0360','\u0362','\u0338','\u0337','\u0361','\u0489'];
  var ZD = ['\u0316','\u0317','\u0318','\u0319','\u031c','\u031d','\u031e','\u031f','\u0320','\u0324','\u0325','\u0326','\u0329','\u032a','\u032b','\u032c','\u032d','\u032e','\u032f','\u0330','\u0331','\u0332','\u0333','\u0339','\u033a','\u033b','\u033c','\u0345','\u0347','\u0348','\u0349','\u034d','\u034e','\u0353','\u0354','\u0355','\u0356','\u0359','\u035a','\u0323'];

  function generateZalgo(text, up, mid, down, intensity) {
    var maxM = Math.ceil(intensity * 15);
    var minM = Math.max(1, Math.floor(intensity * 3));
    var rnd  = function(a) { return a[Math.floor(Math.random() * a.length)]; };
    var rndN = function(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; };
    var out = '';
    for (var i = 0; i < text.length; i++) {
      out += text[i];
      if (/\s/.test(text[i])) continue;
      if (text.charCodeAt(i) >= 0x2E80) continue; // skip CJK
      if (up)   for (var j = rndN(minM, maxM); j--;) out += rnd(ZU);
      if (mid)  for (var j = rndN(minM, maxM); j--;) out += rnd(ZM);
      if (down) for (var j = rndN(minM, maxM); j--;) out += rnd(ZD);
    }
    return out;
  }

  // ── Utility: hex #rrggbb → rgba(r,g,b,a) ──────────────
  function hexToRgba(hex, alpha) {
    if (!hex || hex.length < 7) return 'rgba(0,0,0,' + alpha + ')';
    var r = parseInt(hex.slice(1,3), 16) || 0;
    var g = parseInt(hex.slice(3,5), 16) || 0;
    var b = parseInt(hex.slice(5,7), 16) || 0;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function normalizePublicMediaPath(src) {
    if (!src || typeof src !== 'string') return src || '';
    var value = src.trim();
    if (/^(?:blob:|data:|https?:|\/\/)/i.test(value)) return value;
    var onSubpath = location.pathname.indexOf('/ggdoveplace/') === 0;
    if (onSubpath) {
      if (value.indexOf('/ggdoveplace/') === 0) return value;
      if (value.charAt(0) === '/') return '/ggdoveplace' + value;
      return value;
    }
    if (value.indexOf('/ggdoveplace/') === 0) return value.replace('/ggdoveplace/', '/');
    return value;
  }

  // ── Works Preview ─────────────────────────────
  // 共用：解析圖片 URL（支援 blob URL、HTTPS、相對路徑、Decap v3 AssetProxy）
  function resolveImg(getAsset, src) {
    if (!src) return '';
    // 已是完整 URL（blob: / https: / http:）→ 直接用
    if (/^(blob:|data:|https?:|\/\/)/.test(src)) return src;
    var normalizedSrc = normalizePublicMediaPath(src);
    // 嘗試透過 getAsset 取得 blob 或 CDN URL
    try {
      var a = getAsset(src);
      if (!a) return normalizedSrc;
      if (typeof a === 'string') return normalizePublicMediaPath(a || normalizedSrc);
      // ImmutableJS Map（Decap v2 style）
      if (typeof a.get === 'function') {
        var u = a.get('url'); if (u) return u;
      }
      // Plain object（Decap v3 AssetProxy）
      if (a.url) return a.url;
      // toString fallback（blob: URL）
      var s = a.toString();
      if (s && s !== '[object Object]') return s;
    } catch(e) {}
    return normalizedSrc;
  }

  function videoEmbedUrl(url) {
    if (!url) return '';
    var u = String(url).trim();
    var yt = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([^&?/]+)/);
    if (yt) return 'https://www.youtube.com/embed/' + yt[1];
    var vm = u.match(/vimeo\.com\/(\d+)/);
    if (vm) return 'https://player.vimeo.com/video/' + vm[1];
    return u;
  }

  function isVideoFile(url) {
    return /^(blob:)/.test(url || '') || /\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(url || '');
  }

  function previewMedia(getAsset, item, style) {
    item = item || {};
    var mediaStyle = Object.assign({
      width: '100%',
      height: '100%',
      objectFit: 'cover',
      background: '#05050a',
      display: 'block'
    }, style || {});
    var rawVideo = item.video || item.videoUrl || '';
    if (rawVideo) {
      var resolvedVideo = resolveImg(getAsset, rawVideo);
      var embed = videoEmbedUrl(rawVideo);
      if (isVideoFile(resolvedVideo) || isVideoFile(rawVideo)) {
        return h('video', { src: resolvedVideo, autoPlay: true, loop: true, muted: true, playsInline: true, 'webkit-playsinline': 'webkit-playsinline', preload: 'auto', style: mediaStyle });
      }
      return h('iframe', {
        src: embed,
        title: item.caption || item.title || 'Video',
        frameBorder: '0',
        allowFullScreen: true,
        style: Object.assign({}, mediaStyle, { border: '0' })
      });
    }
    var image = item.src || item.image || '';
    if (image) {
      return h('img', {
        src: resolveImg(getAsset, image),
        alt: item.caption || item.mediaAlt || item.title || '',
        loading: 'eager',
        decoding: 'async',
        style: mediaStyle
      });
    }
    return h('pre', {
      style: {
        margin: 0,
        padding: '1rem',
        whiteSpace: 'pre-wrap',
        color: 'rgba(206,255,42,0.6)',
        fontFamily: '"Courier New",monospace',
        fontSize: '0.62rem',
        lineHeight: 1.35
      }
    }, item.placeholder || 'FILE WITHOUT IMAGE');
  }

  var WorksPreview = createClass({
    render: function() {
      var entry     = this.props.entry;
      var getAsset  = this.props.getAsset;
      var projects  = entry.getIn(['data', 'projects']);
      if (!projects) {
        return h('div', { style: { padding: '2rem', color: '#6a6080', fontFamily: 'monospace', fontSize: '0.8rem' } },
          'No projects yet.');
      }
      var list = projects.toJS ? projects.toJS() : [];
      return h('div', null,
        h('h2', { className: 'page-title' }, 'Works — Live Preview'),
        h('div', { className: 'gallery-grid layout-grid size-medium', style: { marginTop: '1rem' } },
          list.map(function(p, i) {
            return h('div', { key: i, className: 'gallery-item' },
              h('img', {
                src: resolveImg(getAsset, p.image),
                alt: p.title || ('Work ' + (p.id || (i + 1))),
                loading: 'lazy',
                style: { width: '100%', aspectRatio: '4/3', objectFit: 'cover', background: '#110d28', display: 'block' }
              }),
              h('div', { className: 'gallery-caption' },
                h('h3', null, p.title || ''),
                h('p', null, [p.year, p.medium].filter(Boolean).join('  \xb7  '))
              )
            );
          })
        )
      );
    }
  });
  CMS.registerPreviewTemplate('projects', WorksPreview);
  CMS.registerPreviewTemplate('works', WorksPreview);

  // ── Weapons Preview ───────────────────────────
  var WeaponsPreview = createClass({
    render: function() {
      var entry   = this.props.entry;
      var weapons = entry.getIn(['data', 'weapons']);
      if (!weapons) return h('div', { style: { padding: '2rem', color: '#6a6080', fontFamily: 'monospace', fontSize: '0.8rem' } }, 'No weapons yet.');
      var list = weapons.toJS ? weapons.toJS() : [];
      return h('div', null,
        h('h2', { className: 'page-title' }, 'Weapons — Live Preview'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '1.4rem', marginTop: '1rem' } },
          list.map(function(w, i) {
            return h('div', { key: i, style: { background: '#0d0820', overflow: 'hidden' } },
              h('img', { src: resolveImg(getAsset, w.image), alt: w.name || '', loading: 'lazy',
                style: { width: '100%', aspectRatio: '1/1', objectFit: 'cover', display: 'block', background: '#110d28' } }),
              h('div', { style: { padding: '0.6rem 0.7rem' } },
                h('div', { style: { color: '#eee8ff', fontFamily: 'Georgia,serif', fontSize: '0.9rem' } }, w.name || ''),
                w.price ? h('div', { style: { color: '#7755ff', fontFamily: 'Courier New,monospace', fontSize: '0.72rem', marginTop: '0.2rem' } }, w.price) : null
              )
            );
          })
        )
      );
    }
  });
  CMS.registerPreviewTemplate('weapons', WeaponsPreview);
  CMS.registerPreviewTemplate('weapons_data', WeaponsPreview);

  // Relic Preview (current main Relic page: Works + Weapons)
  var RelicPreview = createClass({
    render: function() {
      var entry    = this.props.entry;
      var getAsset = this.props.getAsset;
      var projects = entry.getIn(['data', 'projects']);
      var weapons  = entry.getIn(['data', 'weapons']);
      var works = projects && projects.toJS ? projects.toJS() : [];
      var relics = weapons && weapons.toJS ? weapons.toJS() : [];
      var combined = works.map(function(p) {
        return { type: 'Work', image: p.image, title: p.title, meta: [p.year, p.medium, p.dimensions].filter(Boolean).join('  ·  ') };
      }).concat(relics.map(function(w) {
        return { type: 'Object', image: w.image, title: w.name, meta: w.price || '' };
      }));
      if (!combined.length) return h('div', { style: { padding: '2rem', color: '#6a6080', fontFamily: 'monospace', fontSize: '0.8rem' } }, 'No relic items yet.');
      return h('div', null,
        h('h2', { className: 'page-title' }, 'Relics — Live Preview'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(180px,1fr))', gap: '1.1rem', marginTop: '1rem' } },
          combined.map(function(item, i) {
            return h('div', { key: i, style: { background: '#0d0820', border: '1px solid rgba(120,85,255,0.16)', overflow: 'hidden' } },
              previewMedia(getAsset, item, { width: '100%', aspectRatio: '4/3', height: 'auto' }),
              h('div', { style: { padding: '0.65rem 0.75rem' } },
                h('div', { style: { color: '#7755ff', fontFamily: '"Courier New",monospace', fontSize: '0.62rem', letterSpacing: '0.16em', textTransform: 'uppercase', marginBottom: '0.25rem' } }, item.type),
                h('div', { style: { color: '#eee8ff', fontFamily: 'Georgia,serif', fontSize: '0.92rem', lineHeight: 1.35 } }, item.title || ''),
                item.meta ? h('div', { style: { color: '#6a6080', fontFamily: '"Courier New",monospace', fontSize: '0.68rem', marginTop: '0.25rem' } }, item.meta) : null
              )
            );
          })
        )
      );
    }
  });
  CMS.registerPreviewTemplate('relic', RelicPreview);
  CMS.registerPreviewTemplate('relic_data', RelicPreview);

  var DEFAULT_PLAY_WORKS = [

  function hasTextValue(value) {
    return typeof value === 'string' && value.trim() !== '';
  }

  function mergePlayPreviewWorks(rawWorks) {
    var works = Array.isArray(rawWorks) ? rawWorks : [];
    var validOverrides = works.filter(function(work) {
      return work && hasTextValue(work.titleEn);
    });
    var used = {};
    var merged = DEFAULT_PLAY_WORKS.map(function(base) {
      var override = validOverrides.find(function(work) {
        return String(work.titleEn || '').trim() === base.titleEn;
      });
      if (!override) return Object.assign({}, base);
      used[base.titleEn] = true;
      var next = Object.assign({}, base, override);
      if (!hasTextValue(override.video)) next.video = base.video;
      if (!hasTextValue(override.aspect)) next.aspect = base.aspect;
      return next;
    });
    validOverrides.forEach(function(work) {
      if (used[String(work.titleEn || '').trim()]) return;
      merged.push(work);
    });
    return merged;
  }

  // ── VHS Visual Effect Preview ────────────────────────────────────
  // Faithfully mirrors vhs-effect.js layer stack (z-order):
  //   photo (untouched)
  //   vhs-edge   box-shadow inset — NO backdropFilter (removed in real engine)
  //   vhs-tint   flat color, normal opacity — NO blend mode
  //   vhs-vignette  radial-gradient ellipse 76%×72%, opacity=vignetteOpacity
  //   vhs-canvas (screen blend): glow, grain, scanlines, chromatic, artifacts, rolling bar
  // ────────────────────────────────────────────────────────────────
  var VHSPreview = createClass({
    getInitialState: function() {
      return { tick: 0, barY: -55, barActive: false, barOp: 0.5, barH: 25 };
    },
    componentDidMount: function() {
      var self = this;
      self._t = 0; self._barY = -55; self._barActive = false;
      self._barTimer = 0; self._barOp = 0.5; self._barH = 25; self._barSpd = 3;
      self._iv = setInterval(function() {
        self._t++;
        self._barTimer++;
        if (!self._barActive && self._barTimer > 110 + ((self._t * 73) % 110)) {
          self._barActive = true;
          self._barY   = -55;
          self._barH   = 22 + ((self._t * 37) % 28);
          self._barOp  = 0.38 + ((self._t * 13) % 100) / 370;
          self._barSpd = 2.2 + ((self._t * 19) % 100) / 28;
          self._barTimer = 0;
        }
        if (self._barActive) {
          self._barY += self._barSpd;
          if (self._barY > 115) self._barActive = false;
        }
        self.setState({ tick: self._t, barY: self._barY, barActive: self._barActive,
                        barOp: self._barOp, barH: self._barH });
      }, 100);
    },
    componentWillUnmount: function() { clearInterval(this._iv); },
    render: function() {
      var entry = this.props.entry;

      // Read params — defaults match vhs-effect.js defaults object
      var enabled    = entry.getIn(['data', 'enabled']) !== false;
      var vigOp      = +(entry.getIn(['data', 'vignetteOpacity'])     || 0.82);
      var vigColor   =   entry.getIn(['data', 'vignetteColor'])       || '#030010';
      var overCol    =   entry.getIn(['data', 'overlayColor'])        || '#06011a';
      var overOp     = +(entry.getIn(['data', 'overlayOpacity'])      || 0.12);
      var edgeSize   = +(entry.getIn(['data', 'edgeBlurSize'])        || 65);
      var rollingBar =   entry.getIn(['data', 'rollingBarEnabled'])  !== false;
      var grainOp    = +(entry.getIn(['data', 'grainOpacity'])        || 0.075);
      var scanOp     = +(entry.getIn(['data', 'scanlinesOpacity'])    || 0.13);
      var scanSpc    = +(entry.getIn(['data', 'scanlinesSpacing'])    || 3);
      var artOp      = +(entry.getIn(['data', 'artifactsOpacity'])    || 0.38);
      var glowInt    = +(entry.getIn(['data', 'glowIntensity'])       || 1.50);
      var glowCol    =   entry.getIn(['data', 'glowColor'])           || '#5522ff';
      var chromAb    = +(entry.getIn(['data', 'chromaticAberration']) || 2.2);

      var tick = this.state.tick, barY = this.state.barY;
      var barActive = this.state.barActive, barOp = this.state.barOp, barH = this.state.barH;

      var sampleImg = 'https://zhenggdove-artist.github.io/ggdoveplace/images/project-01.jpg';
      var abs = { position: 'absolute', inset: 0, pointerEvents: 'none' };

      if (!enabled) {
        return h('div', { style: { padding: '2rem' } },
          h('h2', { className: 'page-title' }, 'VHS Effect \u2014 DISABLED'),
          h('div', { style: { position: 'relative', width: '100%', paddingTop: '56.25%',
            background: '#111128', border: '1px solid #1e1840', overflow: 'hidden' } },
            h('div', { style: Object.assign({}, abs, { display: 'flex', alignItems: 'center',
              justifyContent: 'center', fontFamily: '"Courier New",monospace',
              fontSize: '0.8rem', color: '#6a6080', letterSpacing: '0.2em' }) },
              '[ VHS EFFECT OFF ]')
          )
        );
      }

      // LAYER 1: vhs-edge — box-shadow only, NO backdropFilter
      var edgeShadow = 'inset 0 0 ' + edgeSize + 'px ' + Math.round(edgeSize * 0.55) + 'px ' + vigColor;

      // LAYER 3: vhs-vignette
      // Real: radial-gradient(ellipse 76% 72% at 50% 50%, transparent 20%,
      //        vigColor+'bb' 52%, vigColor+'ff' 100%) + opacity:vignetteOpacity
      // 'bb'=187/255=0.733, 'ff'=1.0
      var vigBg = 'radial-gradient(ellipse 76% 72% at 50% 50%, transparent 20%, ' +
        hexToRgba(vigColor, 0.733) + ' 52%, ' + hexToRgba(vigColor, 1.0) + ' 100%)';

      // LAYER 4 canvas — ambient glow
      // Real: globalAlpha=0.35, center=(50%,44%), stops: glowColor+a1hex at 0%, +a2hex at 40%
      // a1 = min(255, round(eff*14)), a2 = min(255, round(eff*5)), pulse=0.80+0.20*sin(t*0.018)
      var pulse = 0.80 + 0.20 * Math.sin(tick * 0.018 * Math.PI);
      var eff   = glowInt * pulse;
      var ga1   = Math.min(1.0, (0.35 * Math.min(255, Math.round(eff * 14))) / 255);
      var ga2   = Math.min(1.0, (0.35 * Math.min(255, Math.round(eff * 5)))  / 255);
      var glowBg = 'radial-gradient(ellipse 116% 58% at 50% 44%, ' +
        hexToRgba(glowCol, ga1) + ' 0%, ' + hexToRgba(glowCol, ga2) + ' 40%, transparent 100%)';

      // Scanlines
      var sp = Math.max(1, scanSpc | 0);
      var scanBg = 'repeating-linear-gradient(to bottom,transparent 0px,transparent ' +
        (sp - 1) + 'px,rgba(0,0,0,' + scanOp + ') ' + (sp - 1) + 'px,rgba(0,0,0,' + scanOp + ') ' + sp + 'px)';

      // Chromatic aberration — matches _drawChromatic()
      // zone = min(0.26, ca*0.014+0.07),  str = min(0.18, ca*0.022)
      var zone = Math.min(0.26, chromAb * 0.014 + 0.07);
      var str  = Math.min(0.18, chromAb * 0.022);
      var zp   = (zone * 100).toFixed(1), hp = (zone * 50).toFixed(1);
      var chromBg = [
        'linear-gradient(to right,  rgba(255,0,45,'  + str.toFixed(4) + ') 0%,rgba(255,0,45,'  + (str*0.4).toFixed(4) + ') ' + hp + '%,transparent ' + zp + '%)',
        'linear-gradient(to left,   rgba(0,80,255,'  + str.toFixed(4) + ') 0%,rgba(0,80,255,'  + (str*0.4).toFixed(4) + ') ' + hp + '%,transparent ' + zp + '%)',
        'linear-gradient(to bottom, rgba(180,0,255,' + (str*0.3).toFixed(4) + ') 0%,transparent 12%)'
      ].join(', ');

      // Grain (SVG feTurbulence, seed changes every ~4 ticks = ~26fps)
      var gseed = (tick * 7) % 256;
      var grainSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">' +
        '<filter id="vgn" x="0%" y="0%" width="100%" height="100%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="' + gseed + '" stitchTiles="stitch"/>' +
        '<feColorMatrix type="saturate" values="0"/>' +
        '</filter>' +
        '<rect width="100%" height="100%" filter="url(#vgn)" opacity="' + grainOp + '"/></svg>';

      // Artifacts — probabilistic, mirroring _drawArtifacts() probabilities
      var arts = [];
      if (Math.sin(tick * 0.41 + 1.1) > (1 - artOp * 2.2)) {
        arts.push(h('div', { key: 'a0', style: { position: 'absolute', left: 0, right: 0,
          top: ((Math.sin(tick * 0.57 + 1.91) * 0.5 + 0.5) * 82 + 6).toFixed(1) + '%',
          height: (Math.abs(Math.sin(tick * 0.33)) * 3.5 + 0.5).toFixed(1) + 'px',
          background: 'rgba(100,130,255,' + (artOp * 0.38).toFixed(3) + ')',
          mixBlendMode: 'screen', pointerEvents: 'none' } }));
      }
      if (Math.sin(tick * 0.73 + 2.7) > (1 - artOp * 1.5)) {
        arts.push(h('div', { key: 'a1', style: { position: 'absolute', left: 0,
          top: ((Math.sin(tick * 0.47 + 3.1) * 0.5 + 0.5) * 90 + 5).toFixed(1) + '%',
          width: ((Math.sin(tick * 0.29 + 0.8) * 0.5 + 0.5) * 55 + 25).toFixed(0) + '%',
          height: '1px',
          background: 'rgba(210,218,255,' + (artOp * 0.22).toFixed(3) + ')',
          mixBlendMode: 'screen', pointerEvents: 'none' } }));
      }
      if (Math.sin(tick * 1.13 + 5.2) > (1 - artOp * 1.2)) {
        arts.push(h('div', { key: 'a2', style: { position: 'absolute', left: 0, right: 0,
          top: ((Math.sin(tick * 0.61 + 2.4) * 0.5 + 0.5) * 88 + 6).toFixed(1) + '%',
          height: (2 + (tick % 7)) + 'px',
          background: 'rgba(50,15,170,' + (artOp * 0.16).toFixed(3) + ')',
          mixBlendMode: 'screen', pointerEvents: 'none' } }));
      }

      // Canvas-layer children (all under screen blend)
      var canvasKids = [
        h('div', { key: 'glow',  style: Object.assign({}, abs, { background: glowBg }) }),
        grainOp > 0 ? h('div', { key: 'grain', dangerouslySetInnerHTML: { __html: grainSvg }, style: Object.assign({}, abs) }) : null,
        h('div', { key: 'scan',  style: Object.assign({}, abs, { background: scanBg }) }),
        h('div', { key: 'chrom', style: Object.assign({}, abs, { background: chromBg }) })
      ].concat(arts);

      // Rolling bar (inside canvas / screen-blend layer — matches real engine)
      if (rollingBar && barActive) {
        canvasKids.push(h('div', { key: 'rbar', style: { position: 'absolute', left: 0, right: 0,
          top: barY.toFixed(1) + 'px', height: barH.toFixed(0) + 'px',
          background: 'linear-gradient(to bottom,transparent,rgba(0,0,0,' + barOp.toFixed(2) + ') 25%,rgba(0,0,0,' + barOp.toFixed(2) + ') 75%,transparent)',
          pointerEvents: 'none' } }));
        canvasKids.push(h('div', { key: 'rbar-f', style: { position: 'absolute', left: 0, right: 0,
          top: barY.toFixed(1) + 'px', height: '1.5px',
          background: 'rgba(180,200,255,' + (barOp * 0.35).toFixed(3) + ')',
          pointerEvents: 'none' } }));
      }

      // REC blink + timestamp
      canvasKids.push(h('div', { key: 'rec', style: { position: 'absolute', bottom: '0.5rem', right: '0.65rem',
        fontFamily: '"Courier New",monospace', fontSize: '0.6rem',
        color: tick % 10 < 5 ? 'rgba(255,60,60,0.9)' : 'rgba(255,60,60,0.15)',
        letterSpacing: '0.12em', userSelect: 'none' } }, '\u25cf REC'));
      canvasKids.push(h('div', { key: 'ts', style: { position: 'absolute', bottom: '0.5rem', left: '0.65rem',
        fontFamily: '"Courier New",monospace', fontSize: '0.58rem',
        color: 'rgba(200,220,255,0.45)', letterSpacing: '0.06em' } },
        '00:' + String(Math.floor(tick / 10) % 60).padStart(2, '0') + ':' + String(tick % 10) + '0'));

      // Full container
      var containerStyle = { position: 'relative', width: '100%', paddingTop: '56.25%',
        overflow: 'hidden', background: '#04040c',
        border: '1px solid #1e1840', marginBottom: '0.8rem' };

      var kids = [
        // Base photo — no opacity modification (real engine never touches image opacity)
        h('img', { key: 'img', src: sampleImg, alt: 'preview',
          style: Object.assign({}, abs, { width: '100%', height: '100%', objectFit: 'cover', display: 'block' }) }),
        // vhs-edge: box-shadow only, no backdropFilter
        h('div', { key: 'edge', style: Object.assign({}, abs, { boxShadow: edgeShadow }) }),
        // vhs-tint: flat color, opacity only — NO mixBlendMode
        h('div', { key: 'tint', style: Object.assign({}, abs, { background: overCol, opacity: overOp }) }),
        // vhs-vignette: radial gradient + vignetteOpacity
        h('div', { key: 'vig',  style: Object.assign({}, abs, { background: vigBg, opacity: vigOp }) }),
        // vhs-canvas equivalent: screen blend, all effects inside
        h('div', { key: 'cvs', style: Object.assign({}, abs, { mixBlendMode: 'screen' }) }, canvasKids)
      ];

      var pS = { color: '#7755ff', fontSize: '0.72rem', fontFamily: '"Courier New",monospace' };
      var dS = { color: '#6a6080', fontSize: '0.72rem', fontFamily: '"Courier New",monospace' };
      var oo = function(v) { return h('span', { style: { color: v ? '#55ff99' : '#6a6080',
        fontFamily: '"Courier New",monospace', fontSize: '0.72rem' } }, v ? 'ON' : 'OFF'); };

      return h('div', null,
        h('h2', { className: 'page-title' }, 'VHS Effect \u2014 Live Preview'),
        h('div', { style: containerStyle }, kids),
        h('div', { style: { lineHeight: 2.2, marginTop: '0.5rem' } },
          h('span', { style: dS }, 'Vignette '),      h('span', { style: pS }, vigOp.toFixed(2)),
          h('span', { style: dS }, '  \xb7  Overlay '), h('span', { style: pS }, overOp.toFixed(2)),
          h('span', { style: dS }, '  \xb7  Grain '),   h('span', { style: pS }, grainOp.toFixed(3)),
          h('br', null),
          h('span', { style: dS }, 'Glow '),           h('span', { style: pS }, glowInt.toFixed(2)),
          h('span', { style: dS }, '  \xb7  Chroma '), h('span', { style: pS }, chromAb.toFixed(1)),
          h('span', { style: dS }, '  \xb7  Scan '),   h('span', { style: pS }, scanOp.toFixed(2)),
          h('span', { style: dS }, '  \xb7  Artifacts '), h('span', { style: pS }, artOp.toFixed(2)),
          h('br', null),
          h('span', { style: dS }, 'Rolling Bar '), oo(rollingBar),
          h('span', { style: dS }, '  \xb7  Edge '), h('span', { style: pS }, edgeSize + 'px')
        )
      );
    }
  });

  function normalizeSubscriptionImageSize(value) {
    var normalized = String(value || 'contain').trim().toLowerCase();
    if (normalized === 'cover' || normalized === 'auto') return normalized;
    return 'contain';
  }

  function normalizeSubscriptionImageHeight(value) {
    var raw = String(value || '260px').trim();
    if (/^\d+(\.\d+)?(px|rem|em|vh|vw|%)$/.test(raw)) return raw;
    if (/^\d+(\.\d+)?$/.test(raw)) return raw + 'px';
    return '260px';
  }

  function normalizeSubscriptionImageWidth(value) {
    var raw = String(value || '100%').trim();
    if (!raw) return '100%';
    if (raw === 'auto' || raw === 'fit-content' || raw === 'max-content' || raw === 'min-content') return raw;
    if (/^\d+(\.\d+)?(px|rem|em|vh|vw|%)$/.test(raw)) return raw;
    if (/^\d+(\.\d+)?$/.test(raw)) return raw + 'px';
    return raw;
  }

  function normalizeShopLink(value) {
    var raw = String(value || '').trim();
    return raw || '';
  }

  function normalizeShopMediaWidth(value, fallback) {
    var raw = String(value || '').trim();
    if (!raw) return fallback;
    if (raw === 'auto' || raw === 'fit-content' || raw === 'max-content' || raw === 'min-content') return raw;
    if (/^\d+(\.\d+)?(px|rem|em|vh|vw|%)$/.test(raw)) return raw;
    if (/^\d+(\.\d+)?$/.test(raw)) return raw + 'px';
    return fallback;
  }

  function normalizeShopMediaHeight(value, fallback) {
    var raw = String(value || '').trim();
    if (!raw) return fallback;
    if (raw === 'auto') return raw;
    if (/^\d+(\.\d+)?(px|rem|em|vh|vw|%)$/.test(raw)) return raw;
    if (/^\d+(\.\d+)?$/.test(raw)) return raw + 'px';
    return fallback;
  }

  function normalizeShopMediaFit(value, fallback) {
    var raw = String(value || '').trim().toLowerCase();
    if (raw === 'cover' || raw === 'contain' || raw === 'auto') return raw;
    return fallback;
  }

  function normalizeShopMediaPosition(value, fallback) {
    var raw = String(value || '').trim();
    return raw || fallback;
  }

  function normalizeSubscriptionImagePosition(value) {
    var normalized = String(value || 'center center').trim().toLowerCase();
    if (normalized === 'center top' || normalized === 'top') return 'center top';
    if (normalized === 'center bottom' || normalized === 'bottom') return 'center bottom';
    return 'center center';
  }

  function normalizeSubscriptionCssValue(value, fallback) {
    var raw = String(value || '').trim();
    return raw || fallback;
  }

  function getSubscriptionTheme(sub) {
    sub = sub || {};
    return {
      panelBackground: normalizeSubscriptionCssValue(sub.panelBackground, 'rgba(255,255,255,0.70)'),
      panelBorderColor: normalizeSubscriptionCssValue(sub.panelBorderColor, 'rgba(206,255,42,0.72)'),
      panelGlowColor: normalizeSubscriptionCssValue(sub.panelGlowColor, 'rgba(206,255,42,0.12)'),
      asciiColor: normalizeSubscriptionCssValue(sub.asciiColor, 'rgba(206,255,42,0.66)'),
      asciiFontFamily: normalizeSubscriptionCssValue(sub.asciiFontFamily, '"Courier New", monospace'),
      kickerColor: normalizeSubscriptionCssValue(sub.kickerColor, '#58f4ff'),
      kickerSize: normalizeSubscriptionCssValue(sub.kickerSize, '0.72rem'),
      kickerFontFamily: normalizeSubscriptionCssValue(sub.kickerFontFamily, '"Courier New", monospace'),
      titleColor: normalizeSubscriptionCssValue(sub.titleColor, '#181845'),
      titleSize: normalizeSubscriptionCssValue(sub.titleSize, '2.8rem'),

  // ── 草稿自動暫存系統 (localStorage) ─────────────
  // 每次表單輸入後自動把目前所有欄位值暫存到 localStorage；
  // 當使用者按上一頁再回來時，偵測到草稿並顯示「恢復草稿」橫幅。
  (function() {
    var DRAFT_PREFIX = 'ggcms-draft:';
    var _draftKey    = null;
    var _saveTimer   = null;
    var _banner      = null;
    var _dirty       = false;

    // ── 取得目前路由 key ──
    function routeKey() {
      return DRAFT_PREFIX + (location.hash || '#/').replace(/[^a-zA-Z0-9_/:=-]/g, '_');
    }

    // ── 收集表單欄位值 ──
    function collectFields() {
      var data = {};
      document.querySelectorAll(
        'input[type="text"], input[type="number"], input[type="url"], input[type="email"], textarea'
      ).forEach(function(el) {
        var key = el.id || el.name || el.getAttribute('aria-label') || el.placeholder;
        if (key) data[key] = el.value;
      });
      // 也記錄 checkbox / toggle
      document.querySelectorAll('input[type="checkbox"]').forEach(function(el) {
        var key = el.id || el.name;
        if (key) data['__chk__' + key] = el.checked;
      });
      return data;
    }

    // ── 存草稿 ──
    function saveDraft() {
      if (!_draftKey) return;
      var fields = collectFields();
      if (!Object.keys(fields).length) return;
      try {
        localStorage.setItem(_draftKey, JSON.stringify({ ts: Date.now(), fields: fields }));
      } catch(e) {}
    }

    // ── 讀取草稿並嘗試恢復值 ──
    function tryRestoreDraft(key) {
      var raw;
      try { raw = localStorage.getItem(key); } catch(e) {}
      if (!raw) return;
      var draft;
      try { draft = JSON.parse(raw); } catch(e) { return; }
      if (!draft || !draft.fields) return;

      var minAgo = Math.round((Date.now() - draft.ts) / 60000);
      var timeStr = minAgo < 1 ? '剛才' : minAgo + ' 分鐘前';

      // 顯示恢復橫幅
      showRestoreBanner(timeStr, function() {
        // 用 React native setter trick 注入值回表單
        Object.entries(draft.fields).forEach(function(pair) {
          var fieldKey = pair[0], val = pair[1];
          if (fieldKey.startsWith('__chk__')) return; // skip checkbox for now
          document.querySelectorAll(
            'input[type="text"], input[type="number"], input[type="url"], input[type="email"], textarea'
          ).forEach(function(el) {
            var k = el.id || el.name || el.getAttribute('aria-label') || el.placeholder;
            if (k === fieldKey) {
              var proto = Object.getPrototypeOf(el);
              var setter = Object.getOwnPropertyDescriptor(proto, 'value');
              if (setter && setter.set) {
                setter.set.call(el, val);
                el.dispatchEvent(new Event('input',  { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }
          });
        });
        hideBanner();
      }, function() {
        // 捨棄草稿
        try { localStorage.removeItem(key); } catch(e) {}
        hideBanner();
      });
    }

    // ── 橫幅 UI ──
    function showRestoreBanner(timeStr, onRestore, onDiscard) {
      if (_banner) return;
      _banner = document.createElement('div');
      _banner.style.cssText = [
        'position:fixed', 'bottom:0', 'left:0', 'right:0', 'z-index:99999',
        'background:#1a0d2e', 'border-top:2px solid #7755ff',
        'padding:0.85rem 1.4rem', 'display:flex', 'align-items:center', 'gap:1.2rem',
        'font-family:"Courier New",monospace', 'font-size:0.8rem', 'color:#c8c0e8',
        'box-shadow:0 -4px 20px rgba(80,40,160,0.4)'
      ].join(';');

      var msg = document.createElement('span');
      msg.textContent = '⚠️  偵測到 ' + timeStr + ' 的未儲存草稿';
      msg.style.flex = '1';

      var btnRestore = document.createElement('button');
      btnRestore.textContent = '恢復草稿';
      btnRestore.style.cssText = 'background:#7755ff;color:#fff;border:none;padding:0.35rem 0.9rem;cursor:pointer;font-family:inherit;font-size:0.76rem;border-radius:2px;';
      btnRestore.onclick = onRestore;

      var btnDiscard = document.createElement('button');
      btnDiscard.textContent = '捨棄';
      btnDiscard.style.cssText = 'background:none;color:#6a6080;border:1px solid #3a3060;padding:0.35rem 0.9rem;cursor:pointer;font-family:inherit;font-size:0.76rem;border-radius:2px;';
      btnDiscard.onclick = onDiscard;

      _banner.appendChild(msg);
      _banner.appendChild(btnRestore);
      _banner.appendChild(btnDiscard);
      document.body.appendChild(_banner);
    }

    function hideBanner() {
      if (_banner) { _banner.remove(); _banner = null; }
    }

    // ── 監聽表單輸入，防抖 5 秒後存檔 ──
    document.addEventListener('input', function(e) {
      var tag = e.target.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return;
      _dirty = true;
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(saveDraft, 5000);
    }, true);

    // ── 路由切換時：儲存目前草稿，並檢查新路由是否有草稿 ──
    var _lastHash = location.hash;
    window.addEventListener('hashchange', function() {
      // 離開時先把未儲存的草稿寫入 localStorage
      if (_dirty && _draftKey) {
        saveDraft();
        _dirty = false;
      }
      hideBanner();
      var newKey = routeKey();
      _draftKey = newKey;
      _lastHash = location.hash;

      // 稍等 CMS 渲染完表單再嘗試恢復
      setTimeout(function() { tryRestoreDraft(newKey); }, 800);
    });

    // 初始化
    _draftKey = routeKey();
    setTimeout(function() { tryRestoreDraft(_draftKey); }, 1200);

    function normalizeStoredMediaPath(fieldName, value) {
      if (!value || typeof value !== 'string') return value;
      var key = String(fieldName || '').toLowerCase();
      if (!/^(image|src|photo|video)$/.test(key)) return value;
      var v = value.trim();
      if (!v || /^(?:blob:|data:|https?:|\/\/)/i.test(v)) return value;
      if (v.indexOf('/ggdoveplace/') === 0) return v;
      if (v.indexOf('/SHOP/') === 0 || v.indexOf('/images/') === 0) return '/ggdoveplace' + v;
      if (v.indexOf('SHOP/') === 0 || v.indexOf('images/') === 0) return '/ggdoveplace/' + v;
      return value;
    }

    function normalizeEntryMediaPaths(value, fieldName) {
      if (value && typeof value.map === 'function' && typeof value.toJS === 'function') {
        return value.map(function(child, childKey) {
          return normalizeEntryMediaPaths(child, childKey);
        });
      }
      return normalizeStoredMediaPath(fieldName, value);
    }

    // 存檔成功後清除草稿（Decap CMS editorial workflow 的 preSave 事件）
    if (window.CMS && window.CMS.registerEventListener) {
      window.CMS.registerEventListener({
        name: 'preSave',
        handler: function(event) {
          _dirty = false;
          clearTimeout(_saveTimer);
          if (_draftKey) {
            try { localStorage.removeItem(_draftKey); } catch(e) {}
          }
          hideBanner();
          if (event && event.entry && typeof event.entry.get === 'function') {
            return normalizeEntryMediaPaths(event.entry.get('data'));
          }
        }
      });
    }

    // ── Beforeunload：關閉瀏覽器時警告 ──
    var _titleDirty = false;
    new MutationObserver(function() {
      _titleDirty = document.title.startsWith('*');
    }).observe(document.querySelector('title') || document.head, { subtree: true, childList: true, characterData: true });

    window.addEventListener('beforeunload', function(e) {
      if (_titleDirty || _dirty) {
        e.preventDefault();
        e.returnValue = '你有未儲存的變更。確定要離開嗎？';
      }
    });
  })();
  </script>
</body>
</html>
