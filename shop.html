<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — GGdove</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Saint';
      src: url('fonts/saint.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --shop-bg: #000000;
      --shop-panel: rgba(4, 4, 12, 0.82);
      --shop-line: rgba(206, 255, 42, 0.28);
      --shop-line-strong: rgba(206, 255, 42, 0.72);
      --shop-cyan: #58f4ff;
      --shop-pink: #ff3edb;
      --shop-acid: #ceff2a;
      --shop-red: #ff295a;
      --shop-text: #d6def0;
      --shop-dim: #7b819b;
      --shop-mono: 'Courier New', monospace;
      --shop-saint: 'Saint', 'Courier New', monospace;
    }

    body.shop-body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 20%, rgba(255, 62, 219, 0.12), transparent 27%),
        radial-gradient(circle at 82% 12%, rgba(88, 244, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #000000 0%, #05020a 48%, #000000 100%);
      color: var(--shop-text);
      cursor: none;
      overflow-x: hidden;
    }

    .shop-scanlines {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(206, 255, 42, 0.035) 3px,
          rgba(206, 255, 42, 0.035) 6px
        );
      mix-blend-mode: screen;
    }

    .shop-noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px),
        radial-gradient(rgba(88,244,255,0.08) 1px, transparent 1px);
      background-size: 31px 31px, 47px 47px;
      background-position: 0 0, 12px 18px;
      opacity: 0.38;
    }

    .landing-header.shop-landing-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 2rem;
      gap: 1rem;
      pointer-events: none;
    }

    .ascii-deco {
      font-family: var(--shop-mono);
      font-size: 0.9rem;
      color: rgba(206, 255, 42, 0.34);
      white-space: nowrap;
    }

    .landing-artist {
      font-family: var(--shop-saint);
      font-size: 1.05rem;
      letter-spacing: 0.34em;
      color: rgba(214, 222, 240, 0.72);
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: -2px 0 rgba(255, 62, 219, 0.52), 2px 0 rgba(88, 244, 255, 0.38);
    }

    .dino-cursor {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 48px;
      height: auto;
      opacity: 0;
      transform: translate(-24px, -24px);
      user-select: none;
    }

    .shop-page {
      position: relative;
      z-index: 5;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 6.8rem 0 4rem;
    }

    .shop-page nav {
      border-bottom-color: rgba(206, 255, 42, 0.18);
      margin-bottom: 2.8rem;
    }

    .shop-page .nav-logo {
      font-family: var(--shop-saint);
      color: var(--shop-acid);
    }

    .shop-page .nav-links a {
      color: rgba(214, 222, 240, 0.55);
    }

    .shop-page .nav-links a:hover,
    .shop-page .nav-links a.active {
      color: var(--shop-acid);
      text-shadow: 0 0 16px rgba(206, 255, 42, 0.55);
    }

    .shop-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.6fr);
      gap: 2rem;
      align-items: end;
      margin-bottom: 4rem;
      padding-bottom: 1.6rem;
      border-bottom: 1px solid rgba(206, 255, 42, 0.22);
    }

    .shop-kicker,
    .subscription-panel,
    .subscription-kicker,
    .subscription-copy,
    .subscription-price,
    .subscription-button,
    .subscription-note,
    .subscription-ascii,
    .subscription-media,
    .section-label,
    .item-kicker,
    .shop-meta,
    .archive-statement,
    .purchase-note,
    .shop-footer {
      font-family: var(--shop-mono);
    }

    .shop-kicker {
      margin-bottom: 0.8rem;
      color: var(--shop-cyan);
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .shop-title {
      margin: 0;
      font-family: var(--shop-saint);
      color: var(--shop-text);
      font-size: clamp(2.6rem, 9vw, 7.4rem);
      font-weight: normal;
      letter-spacing: 0.12em;
      line-height: 0.92;
      text-transform: uppercase;
      text-shadow:
        -4px 0 rgba(255, 62, 219, 0.58),
        3px 0 rgba(88, 244, 255, 0.48),
        0 0 40px rgba(206, 255, 42, 0.20);
    }

    .shop-terminal {
      border: 1px solid rgba(88, 244, 255, 0.22);
      background: rgba(0, 0, 0, 0.44);
      padding: 1rem;
      color: rgba(214, 222, 240, 0.72);
      font-family: var(--shop-mono);
      font-size: 0.74rem;
      line-height: 1.75;
      box-shadow: inset 0 0 32px rgba(88, 244, 255, 0.06);
    }

    .shop-terminal span {
      color: var(--shop-acid);
    }

    .subscription-panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: -1.6rem 0 4.8rem;
      padding: 1.5rem;
      border: 1px solid var(--shop-line-strong);
      background:
        linear-gradient(135deg, rgba(206, 255, 42, 0.14), transparent 34%),
        linear-gradient(225deg, rgba(255, 62, 219, 0.14), transparent 42%),
        rgba(0, 0, 0, 0.82);
      box-shadow:
        0 0 48px rgba(206, 255, 42, 0.16),
        inset 0 0 0 1px rgba(88, 244, 255, 0.18),
        inset 0 0 42px rgba(255, 62, 219, 0.08);
    }

    .subscription-panel::before {
      content: ". . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .";
      position: absolute;
      inset: 0.7rem 0.9rem auto;
      z-index: -1;
      color: rgba(88, 244, 255, 0.18);
      font-family: var(--shop-mono);
      font-size: 0.72rem;
      line-height: 1.4;
      word-break: break-all;
      pointer-events: none;
    }

    .subscription-panel::after {
      content: "";
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      width: 34%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--shop-pink), var(--shop-cyan));
      box-shadow: 0 0 22px rgba(255, 62, 219, 0.5);
      pointer-events: none;
    }

    .subscription-ascii {
      color: rgba(206, 255, 42, 0.68);
      font-size: 0.68rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
    }

    .subscription-ascii.bottom {
      margin-top: 1.35rem;
      color: rgba(255, 62, 219, 0.52);
    }

    .subscription-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(240px, 0.52fr);
      gap: 2rem;
      align-items: end;
      padding: 1.2rem 0 0;
    }

    .subscription-media {
      grid-column: 1;
      grid-row: 1;
      margin: 0 0 1rem;
      width: var(--subscription-image-width, 100%);
      max-width: 100%;
      border: 1px solid rgba(88, 244, 255, 0.18);
      background: #030307;
      overflow: hidden;
      --subscription-image-height: 260px;
      --subscription-image-fit: contain;
      --subscription-image-position: center center;
    }

    .subscription-media img {
      display: block;
      width: 100%;
      height: var(--subscription-image-height, auto);
      object-fit: var(--subscription-image-fit, contain);
      object-position: var(--subscription-image-position, center center);
      max-height: none;
      background: #030307;
    }

    .subscription-media--auto img {
      height: auto;
      object-fit: contain;
    }

    .subscription-heading {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .subscription-heading .subscription-kicker {
      margin-bottom: 0;
    }

    .subscription-kicker {
      margin: 0 0 0.75rem;
      color: var(--shop-cyan);
      font-size: 0.72rem;
      line-height: 1.5;
      text-transform: uppercase;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .subscription-title {
      margin: 0;
      color: var(--shop-text);
      font-family: var(--shop-saint);
      font-size: 2.8rem;
      font-weight: normal;
      line-height: 1.06;
      text-shadow:
        -3px 0 rgba(255, 62, 219, 0.58),
        2px 0 rgba(88, 244, 255, 0.46),
        0 0 32px rgba(206, 255, 42, 0.24);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .subscription-copy {
      grid-column: 1 / -1;
      grid-row: 3;
      max-width: 58rem;
      margin: 0.25rem 0 0;
      color: rgba(214, 222, 240, 0.86);
      font-size: 0.9rem;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .subscription-action {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      padding-left: 1.3rem;
      border-left: 1px solid rgba(88, 244, 255, 0.32);
    }

    .subscription-price {
      color: var(--shop-acid);
      font-size: 1.08rem;
      line-height: 1.4;
      text-shadow: 0 0 18px rgba(206, 255, 42, 0.42);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .subscription-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      min-width: 9rem;
      padding: 0.75rem 1.2rem;
      border: 1px solid var(--shop-line-strong);
      color: #000;
      background: var(--shop-acid);
      font-size: 0.8rem;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(206, 255, 42, 0.32);
      transition: color 0.22s, border-color 0.22s, box-shadow 0.22s, background 0.22s;
    }

    .subscription-button:hover {
      color: var(--shop-acid);
      border-color: var(--shop-pink);
      background: rgba(255, 62, 219, 0.08);
      box-shadow: 0 0 30px rgba(255, 62, 219, 0.34);
    }

    .subscription-note {
      margin: 0;
      color: rgba(214, 222, 240, 0.68);
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .shop-section {
      margin-bottom: 4.5rem;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .section-label {
      color: var(--shop-acid);
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .section-rule {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(206,255,42,0.58), transparent);
    }

    .archive-list {
      display: grid;
      gap: 1.4rem;
    }

    .archive-card,
    .stamp-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(206, 255, 42, 0.22);
      background:
        linear-gradient(135deg, rgba(206,255,42,0.07), transparent 34%),
        var(--shop-panel);
      box-shadow:
        inset 0 0 0 1px rgba(255, 62, 219, 0.08),
        0 0 42px rgba(0, 0, 0, 0.55);
    }

    .archive-card::before,
    .stamp-card::before {
      content: attr(data-code);
      position: absolute;
      top: 0.7rem;
      right: 0.8rem;
      z-index: 2;
      font-family: var(--shop-mono);
      color: rgba(88, 244, 255, 0.55);
      font-size: 0.64rem;
      letter-spacing: 0.16em;
    }

    .archive-card {
      display: grid;
      grid-template-columns: minmax(240px, 0.72fr) minmax(0, 1.28fr);
      min-height: 340px;
    }

    .archive-media,
    .stamp-media {
      position: relative;
      min-height: 280px;
      background:
        linear-gradient(90deg, rgba(88,244,255,0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(206,255,42,0.07) 1px, transparent 1px),
        #030307;
      background-size: 22px 22px;
      border-right: 1px solid rgba(206, 255, 42, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .archive-media img,
    .stamp-media img,
    .archive-media video,
    .stamp-media video,
    .archive-media iframe,
    .stamp-media iframe {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      background: #000;
    }

    .shop-media-button {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
    }

    .shop-media-button img {
      transition: transform 0.32s ease, filter 0.32s ease;
    }

    .shop-media-button:hover img {
      transform: scale(1.035);
      filter: contrast(1.08);
    }

    .shop-media-hint {
      position: absolute;
      left: 0.8rem;
      bottom: 0.8rem;
      padding: 0.38rem 0.55rem;
      border: 1px solid rgba(206, 255, 42, 0.46);
      color: var(--shop-acid);
      background: rgba(0, 0, 0, 0.62);
      font-family: var(--shop-mono);
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
    }

    .shop-media-button:hover .shop-media-hint,
    .shop-media-button:focus-visible .shop-media-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .archive-placeholder {
      width: 100%;
      min-height: 100%;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(206, 255, 42, 0.58);
      font-family: var(--shop-mono);
      font-size: clamp(0.56rem, 1.4vw, 0.82rem);
      line-height: 1.35;
      white-space: pre;
      text-shadow: 0 0 18px rgba(206, 255, 42, 0.28);
    }

    .archive-body,
    .stamp-body {
      padding: 1.55rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item-kicker {
      color: var(--shop-pink);
      font-size: 0.66rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .item-title {
      margin: 0;
      color: var(--shop-text);
      font-family: var(--shop-saint);
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      font-weight: normal;
      letter-spacing: 0.08em;
      line-height: 1.18;
    }

    .shop-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem 1rem;
      color: rgba(214, 222, 240, 0.72);
      font-size: 0.76rem;
      line-height: 1.55;
    }

    .shop-meta span {
      color: var(--shop-dim);
    }

    .archive-statement {
      color: rgba(214, 222, 240, 0.82);
      font-size: 0.82rem;
      line-height: 1.9;
      border-left: 1px solid rgba(255, 62, 219, 0.45);
      padding-left: 1rem;
      margin: 0.2rem 0 0;
    }

    .purchase-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(206, 255, 42, 0.14);
    }

    .price-tag {
      font-family: var(--shop-mono);
      color: var(--shop-acid);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 14px rgba(206, 255, 42, 0.32);
    }

    .purchase-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.6rem;
      padding: 0.65rem 1.05rem;
      border: 1px solid rgba(206, 255, 42, 0.58);
      color: var(--shop-acid);
      background: rgba(206, 255, 42, 0.05);
      font-family: var(--shop-mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.22s, border-color 0.22s, box-shadow 0.22s, background 0.22s;
    }

    .purchase-button:hover {
      color: #000;
      border-color: var(--shop-acid);
      background: var(--shop-acid);
      box-shadow: 0 0 26px rgba(206, 255, 42, 0.36);
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    .stamp-card {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .stamp-media {
      min-height: 0;
      aspect-ratio: 1 / 1;
      border-right: none;
      border-bottom: 1px solid rgba(206, 255, 42, 0.16);
    }

    .stamp-media img {
      object-fit: cover;
    }

    .stamp-body {
      flex: 1;
      padding: 1.1rem;
    }

    .stamp-body .item-title {
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.25;
    }

    .stamp-body .shop-meta {
      grid-template-columns: 1fr;
      font-size: 0.72rem;
    }

    .stamp-body .purchase-row {
      align-items: flex-start;
      flex-direction: column;
    }

    .purchase-note {
      margin-top: 2rem;
      padding: 1rem 1.2rem;
      border: 1px dashed rgba(255, 62, 219, 0.42);
      color: rgba(214, 222, 240, 0.82);
      background: rgba(255, 62, 219, 0.045);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .shop-footer {
      position: relative;
      z-index: 5;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 3rem;
      padding: 1.4rem 0 0;
      border-top: 1px solid rgba(206, 255, 42, 0.22);
      color: rgba(214, 222, 240, 0.7);
    }

    .shop-footer h2 {
      margin: 0 0 1rem;
      color: var(--shop-acid);
      font-family: var(--shop-saint);
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .contact-line {
      min-height: 2rem;
      border-bottom: 1px solid rgba(88, 244, 255, 0.22);
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .contact-line span {
      color: var(--shop-dim);
      min-width: 4.5rem;
    }

    body.shop-gallery-open {
      overflow: hidden;
    }

    .shop-lightbox[hidden] {
      display: none;
    }

    .shop-lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      grid-template-columns: minmax(44px, 0.12fr) minmax(0, 1fr) minmax(44px, 0.12fr);
      align-items: center;
      gap: 1rem;
      padding: clamp(1rem, 4vw, 3rem);
      background:
        radial-gradient(circle at 50% 50%, rgba(88, 244, 255, 0.12), transparent 44%),
        rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
    }

    .shop-lightbox-figure {
      margin: 0;
      min-width: 0;
      justify-self: center;
      width: min(980px, 100%);
    }

    .shop-lightbox-figure img {
      display: block;
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      background: #000;
      border: 1px solid rgba(206, 255, 42, 0.24);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    .shop-lightbox-figure figcaption,
    .shop-lightbox-counter {
      font-family: var(--shop-mono);
      color: rgba(214, 222, 240, 0.72);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      margin-top: 0.8rem;
      min-height: 1rem;
    }

    .shop-lightbox-counter {
      color: var(--shop-acid);
    }

    .shop-lightbox-close,
    .shop-lightbox-nav {
      border: 1px solid rgba(206, 255, 42, 0.42);
      color: var(--shop-acid);
      background: rgba(0, 0, 0, 0.48);
      font-family: var(--shop-mono);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .shop-lightbox-close:hover,
    .shop-lightbox-nav:hover {
      color: #000;
      background: var(--shop-acid);
      box-shadow: 0 0 28px rgba(206, 255, 42, 0.32);
    }

    .shop-lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2.4rem;
      height: 2.4rem;
      font-size: 1.1rem;
    }

    .shop-lightbox-nav {
      width: clamp(2.4rem, 5vw, 3.4rem);
      height: clamp(3rem, 8vw, 5rem);
      font-size: clamp(1.2rem, 3vw, 2rem);
      justify-self: center;
    }

    @media (max-width: 980px) {
      .shop-hero {
        grid-template-columns: 1fr;
      }

      .subscription-grid {
        grid-template-columns: 1fr;
        gap: 1.4rem;
      }

      .subscription-media,
      .subscription-heading,
      .subscription-copy,
      .subscription-action {
        grid-column: auto;
        grid-row: auto;
      }

      .subscription-action {
        padding-left: 0;
        border-left: 0;
        border-top: 1px solid rgba(88, 244, 255, 0.32);
        padding-top: 1.2rem;
      }

      .archive-card {
        grid-template-columns: 1fr;
      }

      .archive-media {
        border-right: none;
        border-bottom: 1px solid rgba(206, 255, 42, 0.16);
      }

      .stamp-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      body.shop-body {
        cursor: auto;
      }

      .dino-cursor {
        display: none;
      }

      .shop-page {
        width: min(100% - 24px, 680px);
        padding-top: 5.6rem;
      }

      .landing-header.shop-landing-header {
        padding: 1rem;
      }

      .ascii-deco {
        display: none;
      }

      .landing-artist {
        font-size: 0.92rem;
        letter-spacing: 0.22em;
      }

      .shop-page nav {
        align-items: center;
      }

      .shop-meta,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .subscription-title {
        font-size: 2.25rem;
      }

      .purchase-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 540px) {
      .stamp-grid {
        grid-template-columns: 1fr;
      }

      .archive-body,
      .stamp-body {
        padding: 1rem;
      }

      .subscription-panel {
        margin-top: -1rem;
        padding: 1rem;
      }

      .subscription-title {
        font-size: 1.8rem;
      }

      .subscription-button {
        width: 100%;
      }

      .archive-placeholder {
        padding: 1.2rem;
        font-size: 0.52rem;
      }

      .purchase-button {
        width: 100%;
      }

      .shop-lightbox {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }

      .shop-lightbox-nav {
        width: 100%;
        height: 2.5rem;
      }
    }
  </style>
</head>
<body class="shop-body">
  <div class="shop-noise"></div>
  <div class="shop-scanlines"></div>

  <div class="landing-header shop-landing-header">
    <span class="ascii-deco">o()xxxx[{:::::::::::::::::::></span>
    <span class="landing-artist">&#xFF61;&#xFF65;&#xFF9F;&#xFF65;&#x2727; GGdove / Shop &#x2727;&#xFF65;&#xFF9F;&#xFF65;&#xFF61;</span>
    <span class="ascii-deco">&lt;:::::::::::::::::::}]xxxx()o</span>
  </div>

  <img id="dino-cursor" class="dino-cursor" src="images/cursor-dino.png" alt="" aria-hidden="true">

  <main class="shop-page">
    <nav id="main-nav"></nav>

    <header class="shop-hero">
      <div>
        <p class="shop-kicker" id="shop-kicker">/relic_market :: static_archive :: no_api</p>
        <h1 class="shop-title" id="shop-title">Shop</h1>
      </div>
      <div class="shop-terminal" id="shop-terminal" aria-label="Shop status">
        <p><span>&gt;</span> catalog mounted: /SHOP</p>
        <p><span>&gt;</span> payment state: pending review</p>
        <p><span>&gt;</span> purchase buttons: frontend alert only</p>
      </div>
    </header>

    <div id="shop-sections"></div>
  </main>

  <footer class="shop-footer">
    <h2 id="shop-contact-heading">Contact Info</h2>
    <div class="contact-grid">
      <div class="contact-line" id="shop-contact-email"><span>Email</span>聯絡信箱：</div>
      <div class="contact-line" id="shop-contact-phone"><span>Phone</span>聯絡電話：</div>
    </div>
  </footer>

  <div class="shop-lightbox" id="shop-gallery-modal" hidden aria-modal="true" role="dialog" aria-label="Shop detail images">
    <button class="shop-lightbox-close" id="shop-gallery-close" type="button" aria-label="Close">×</button>
    <button class="shop-lightbox-nav" id="shop-gallery-prev" type="button" aria-label="Previous image">‹</button>
    <figure class="shop-lightbox-figure">
      <img id="shop-gallery-image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
      <figcaption id="shop-gallery-caption"></figcaption>
      <div class="shop-lightbox-counter" id="shop-gallery-counter"></div>
    </figure>
    <button class="shop-lightbox-nav" id="shop-gallery-next" type="button" aria-label="Next image">›</button>
  </div>

  <script src="js/vhs-effect.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadData().then(() => {
      renderHeader('shop');
      renderShop();
      initVHS();
      applyNavHoverColor(siteData.site);
      applyTextStyles(siteData.site);
      applyBackground(siteData.site);
    });

    (function() {
      const cur = document.getElementById('dino-cursor');
      if (!cur || window.innerWidth < 768) return;
      document.addEventListener('mousemove', function(e) {
        cur.style.left = e.clientX + 'px';
        cur.style.top = e.clientY + 'px';
        cur.style.opacity = '1';
      });
      document.addEventListener('mouseleave', function() { cur.style.opacity = '0'; });
      document.addEventListener('mouseenter', function() { cur.style.opacity = '1'; });
    })();
  </script>
</body>
</html>
