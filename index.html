<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGdove</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Saint';
      src: url('fonts/saint.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body.landing-body {
      margin: 0;
      overflow: hidden;
      background: #000000;
      cursor: none;
    }

    .landing-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }

    .tilt-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transform: rotateX(var(--tiltX, 0deg)) rotateY(var(--tiltY, 0deg));
      transition: transform 0.15s ease-out;
    }

    /* ── Creature canvas (replaces TV) ── */
    .creature-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(30px);
      z-index: 2;
      cursor: none;
    }

    /* ── SVG orbital curves + nav ── */
    .landing-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      transform: translateZ(0px);
    }
    .landing-svg a {
      pointer-events: all;
      cursor: none;
    }

    .orbit-curve {
      fill: none;
      stroke: rgba(184, 184, 208, 0.16);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .orbit-curl {
      fill: none;
      stroke: rgba(184, 184, 208, 0.12);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    @keyframes shimmerTravel {
      0%   { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: 0; }
    }
    .orbit-shimmer {
      fill: none;
      stroke: rgba(210, 150, 150, 0.18);
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-dasharray: 50 1350;
      animation: shimmerTravel 10s linear infinite;
    }

    .nav-label {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 19.5px;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: #b8b8d0;
      cursor: none;
      transition: fill 0.3s;
    }
    .nav-label:hover { fill: #ffffff; }

    .nav-sub {
      font-family: 'Courier New', monospace;
      font-size: 13.5px;
      font-style: italic;
      fill: #787890;
      letter-spacing: 1px;
    }

    .nav-ornament {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      fill: rgba(184, 184, 208, 0.35);
    }

    .dino-cursor {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 48px;
      height: auto;
      opacity: 0;
      transform: translate(-24px, -24px);
      user-select: none;
    }

    .landing-scanlines {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 6px
      );
    }

    .landing-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.8rem 2rem;
      gap: 1rem;
      cursor: none;
    }

    .ascii-deco {
      font-family: 'Courier New', monospace;
      font-size: 0.975rem;
      color: rgba(120, 120, 144, 0.4);
      white-space: nowrap;
    }

    .landing-artist {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 1.125rem;
      letter-spacing: 0.35em;
      color: rgba(184, 184, 208, 0.7);
      white-space: nowrap;
    }

    /* Click counter */
    .click-counter {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: rgba(120, 120, 144, 0);
      letter-spacing: 3px;
      transition: color 0.5s;
      pointer-events: none;
    }
    .click-counter.visible {
      color: rgba(120, 120, 144, 0.5);
    }

    @media (max-width: 768px) {
      .nav-label { font-size: 15px; letter-spacing: 2px; }
      .nav-sub { font-size: 10.5px; }
      .dino-cursor { display: none; }
      body.landing-body { cursor: auto; }
      .landing-svg a { cursor: auto; }
      .creature-canvas { cursor: auto; }
      .landing-header { padding: 1rem; }
      .ascii-deco { display: none; }
    }
    @media (max-width: 480px) {
      .nav-label { font-size: 13.5px; letter-spacing: 1.5px; }
    }
  </style>
</head>
<body class="landing-body">
  <div class="landing-scanlines"></div>

  <div class="landing-header">
    <span class="ascii-deco">o()xxxx[{:::::::::::::::::::></span>
    <span class="landing-artist">&#xFF61;&#xFF65;&#xFF9F;&#xFF65;&#x2727; GGdove &#x2727;&#xFF65;&#xFF9F;&#xFF65;&#xFF61;</span>
    <span class="ascii-deco">&lt;:::::::::::::::::::}]xxxx()o</span>
  </div>

  <img id="dino-cursor" class="dino-cursor" src="images/cursor-dino.png" alt="" aria-hidden="true">

  <div class="click-counter" id="click-counter"></div>

  <div class="landing-wrap">
    <div class="tilt-scene" id="tilt-scene">

      <!-- Creature canvas (replaces TV) -->
      <canvas class="creature-canvas" id="creature-canvas" width="300" height="300"></canvas>

      <!-- SVG orbital curves + navigation -->
      <svg class="landing-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
        <path id="c1" class="orbit-curve" d="M 170,235 C 280,95 720,95 830,235"/>
        <path class="orbit-shimmer" d="M 170,235 C 280,95 720,95 830,235"/>
        <path class="orbit-curl" d="M 170,235 C 155,252 143,244 148,228 C 153,214 168,218 170,235"/>
        <path class="orbit-curl" d="M 830,235 C 845,218 857,226 852,242 C 847,256 832,252 830,235"/>

        <path id="c2" class="orbit-curve" d="M 830,235 C 935,340 935,430 830,485"/>
        <path class="orbit-shimmer" d="M 830,235 C 935,340 935,430 830,485" style="animation-delay:-2.5s"/>

        <path id="c3" class="orbit-curve" d="M 830,485 C 720,615 280,615 170,485"/>
        <path class="orbit-shimmer" d="M 830,485 C 720,615 280,615 170,485" style="animation-delay:-5s"/>
        <path class="orbit-curl" d="M 830,485 C 845,500 838,512 822,507 C 808,502 812,485 830,485"/>
        <path class="orbit-curl" d="M 170,485 C 155,500 143,492 148,476 C 153,462 168,466 170,485"/>

        <path id="c4" class="orbit-curve" d="M 170,485 C 65,430 65,340 170,235"/>
        <path class="orbit-shimmer" d="M 170,485 C 65,430 65,340 170,235" style="animation-delay:-7.5s"/>

        <!-- Navigation Labels -->
        <a href="bio.html">
          <text class="nav-ornament" x="115" y="180">&#x2727;</text>
          <text class="nav-label" x="135" y="198">CV</text>
          <text class="nav-sub" x="115" y="218">&#x0489;&#x030D;&#x0352;&#x0357; &#x1D4AB;&#x1D4C1;&#x1D4B8;&#x1D4BB;&#x1D4BE;&#x1D4C1;&#x1D4AE;</text>
        </a>
        <a href="relic.html">
          <text class="nav-ornament" x="870" y="180" text-anchor="end">&#x2727;</text>
          <text class="nav-label" x="855" y="198" text-anchor="end">Relic</text>
          <text class="nav-sub" x="870" y="218" text-anchor="end">&#x0489;&#x030D;&#x0352; &#x1D4B2;&#x1D4C7;&#x1D4C9;&#x1D4BE;&#x1D4BB;&#x1D4B6;&#x1D4B8;&#x1D4C9;&#x1D4C8;</text>
        </a>
        <a href="exhibition.html">
          <text class="nav-ornament" x="870" y="512" text-anchor="end">&#x2727;</text>
          <text class="nav-label" x="855" y="530" text-anchor="end">Exhibition</text>
          <text class="nav-sub" x="870" y="550" text-anchor="end">&#x0489;&#x030D;&#x0352; &#x1D4AE;&#x1D4BD;&#x1D4C4;&#x1D4CC;&#x1D4B8;&#x1D4B6;&#x1D4C8;&#x1D4AE;</text>
        </a>
        <a href="#">
          <text class="nav-ornament" x="115" y="512">&#x2727;</text>
          <text class="nav-label" x="135" y="530">Play</text>
          <text class="nav-sub" x="115" y="550">&#x0489;&#x030D;&#x0352; &#x1D4B2;&#x1D4B6;&#x1D4C2;&#x1D4AE;</text>
        </a>
      </svg>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // ── CMS data ──
    loadData().then(() => {
      applyBackground(siteData.site);
      applyNavHoverColor(siteData.site);
      const artistEl = document.querySelector('.landing-artist');
      if (artistEl && siteData.site && siteData.site.title) {
        artistEl.innerHTML = '\uFF61\uFF65\uFF9F\uFF65\u2727 ' + siteData.site.title + ' \u2727\uFF65\uFF9F\uFF65\uFF61';
      }
      const nl = (siteData.site && siteData.site.navLabels) || {};
      const labels = document.querySelectorAll('.nav-label');
      [nl.bio || 'CV', nl.works || 'Relic', nl.exhibition || 'Exhibition', 'Play']
        .forEach((v, i) => { if (labels[i]) labels[i].textContent = v; });
    });

    // ── 3D Tilt ──
    (function() {
      const scene = document.getElementById('tilt-scene');
      if (!scene) return;
      document.addEventListener('mousemove', function(e) {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        scene.style.setProperty('--tiltY', ((e.clientX - cx) / cx * 6) + 'deg');
        scene.style.setProperty('--tiltX', ((cy - e.clientY) / cy * 3) + 'deg');
      });
      document.addEventListener('mouseleave', function() {
        scene.style.setProperty('--tiltY', '0deg');
        scene.style.setProperty('--tiltX', '0deg');
      });
    })();

    // ── Dino cursor ──
    (function() {
      const cur = document.getElementById('dino-cursor');
      if (!cur || window.innerWidth < 768) return;
      document.addEventListener('mousemove', function(e) {
        cur.style.left = e.clientX + 'px';
        cur.style.top = e.clientY + 'px';
        cur.style.opacity = '1';
      });
      document.addEventListener('mouseleave', function() { cur.style.opacity = '0'; });
      document.addEventListener('mouseenter', function() { cur.style.opacity = '1'; });
    })();

    // ══════════════════════════════════════════════
    //  CREATURE — Point-cloud ASCII spiral + tentacles
    // ══════════════════════════════════════════════
    (function() {
      const canvas = document.getElementById('creature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = 300, H = 300;
      const CX = W / 2, CY = H / 2;

      let clickCount = 0;
      let redirecting = false;
      const counterEl = document.getElementById('click-counter');

      // ASCII glyphs for point rendering (denser = more opaque/closer)
      const GLYPHS = ['.', '\u00B7', '*', 'o', '\u00B0', '+', '\u2022', '\u2219', '\u2727', '@'];

      // ── Generate body points: multiple intertwined spirals ──
      const bodyPoints = [];
      const SPIRAL_COUNT = 5;
      const PTS_PER_SPIRAL = 120;

      for (let s = 0; s < SPIRAL_COUNT; s++) {
        const spiralPhase = (s / SPIRAL_COUNT) * Math.PI * 2;
        const dir = s % 2 === 0 ? 1 : -1;
        const radiusMul = 0.3 + Math.random() * 0.3;
        for (let i = 0; i < PTS_PER_SPIRAL; i++) {
          const t = i / PTS_PER_SPIRAL;
          const angle = t * Math.PI * (5 + s * 1.5) * dir + spiralPhase;
          const r = (5 + t * 55) * radiusMul;
          const wobbleX = Math.sin(t * 12 + s) * (3 + s * 2);
          const wobbleY = Math.cos(t * 10 + s * 3) * (3 + s * 2);
          bodyPoints.push({
            baseX: CX + Math.cos(angle) * r + wobbleX,
            baseY: CY + Math.sin(angle) * r + wobbleY,
            x: 0, y: 0,
            phase: Math.random() * Math.PI * 2,
            speed: 0.2 + Math.random() * 0.6,
            amp: 1.5 + Math.random() * 4,
            glyph: GLYPHS[Math.floor(Math.random() * 6)],
            size: 5 + Math.random() * 5,
            alpha: 0.3 + Math.random() * 0.5
          });
        }
      }

      // Add a dense core cluster
      for (let i = 0; i < 80; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * 25;
        bodyPoints.push({
          baseX: CX + Math.cos(a) * r,
          baseY: CY + Math.sin(a) * r,
          x: 0, y: 0,
          phase: Math.random() * Math.PI * 2,
          speed: 0.3 + Math.random() * 0.8,
          amp: 1 + Math.random() * 3,
          glyph: GLYPHS[4 + Math.floor(Math.random() * 6)],
          size: 6 + Math.random() * 6,
          alpha: 0.4 + Math.random() * 0.5
        });
      }

      // ── Tentacle system ──
      const tentacles = [];

      function spawnTentacle(ox, oy) {
        const angle = Math.random() * Math.PI * 2;
        const length = 30 + Math.random() * 60;
        const ptCount = 15 + Math.floor(Math.random() * 20);
        const curveFreq = 2 + Math.random() * 4;
        const curveAmp = 8 + Math.random() * 15;
        const pts = [];

        for (let i = 0; i < ptCount; i++) {
          const t = i / ptCount;
          const dist = t * length;
          const sway = Math.sin(t * curveFreq) * curveAmp * t;
          const perpAngle = angle + Math.PI / 2;
          pts.push({
            baseX: ox + Math.cos(angle) * dist + Math.cos(perpAngle) * sway,
            baseY: oy + Math.sin(angle) * dist + Math.sin(perpAngle) * sway,
            x: 0, y: 0,
            phase: Math.random() * Math.PI * 2,
            speed: 0.6 + Math.random() * 1.2,
            amp: 2 + Math.random() * 5 * t,
            glyph: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
            size: 7 - t * 3 + Math.random() * 3,
            alpha: 0.5 - t * 0.2
          });
        }

        tentacles.push({ pts, birth: Date.now(), growDuration: 500 + Math.random() * 400 });
      }

      // ── Click detection (hit test against all body points) ──
      canvas.addEventListener('click', function(e) {
        if (redirecting) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top) * (H / rect.height);

        let hit = false;
        for (let i = 0; i < bodyPoints.length; i++) {
          const dx = bodyPoints[i].x - mx;
          const dy = bodyPoints[i].y - my;
          if (dx * dx + dy * dy < 400) { hit = true; break; }
        }
        if (!hit) return;

        clickCount++;

        // Spawn tentacles from random body positions
        const count = 3 + Math.floor(clickCount * 0.8);
        for (let i = 0; i < count; i++) {
          const bp = bodyPoints[Math.floor(Math.random() * bodyPoints.length)];
          spawnTentacle(bp.x, bp.y);
        }

        // Agitate: increase body point amplitudes
        bodyPoints.forEach(p => {
          p.amp += 0.4;
          p.speed += 0.05;
        });

        if (counterEl) {
          counterEl.textContent = clickCount + ' / 10';
          counterEl.classList.add('visible');
        }

        if (clickCount >= 10) {
          redirecting = true;
          setTimeout(function() {
            window.location.href = 'GAME/index.html';
          }, 1200);
        }
      });

      // ── Draw a single ASCII point ──
      function drawPoint(p, t, extraAlpha) {
        const alpha = (p.alpha + (extraAlpha || 0));
        if (alpha <= 0) return;
        ctx.globalAlpha = Math.min(1, alpha);
        ctx.fillText(p.glyph, p.x, p.y);
      }

      // ── Animation ──
      function animate() {
        const t = Date.now() * 0.001;
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Color shifts with agitation
        const r = 184 + clickCount * 8;
        const g = 184 - clickCount * 8;
        const b = 208 - clickCount * 5;
        const baseColor = `rgb(${Math.min(255,r)},${Math.max(80,g)},${Math.max(100,b)})`;

        // ── Update & draw body points ──
        ctx.font = '8px "Courier New", monospace';
        ctx.fillStyle = baseColor;
        for (let i = 0; i < bodyPoints.length; i++) {
          const p = bodyPoints[i];
          p.x = p.baseX + Math.sin(t * p.speed + p.phase) * p.amp;
          p.y = p.baseY + Math.cos(t * p.speed * 0.7 + p.phase + i * 0.01) * p.amp;
          ctx.font = p.size + 'px "Courier New", monospace';
          drawPoint(p, t, 0);
        }

        // ── Update & draw tentacle points ──
        const now = Date.now();
        for (let ti = 0; ti < tentacles.length; ti++) {
          const ten = tentacles[ti];
          const growT = Math.min(1, (now - ten.birth) / ten.growDuration);
          const visCount = Math.floor(ten.pts.length * growT);

          const tenR = Math.min(255, 200 + clickCount * 6);
          const tenG = Math.max(60, 120 - clickCount * 5);
          const tenB = Math.max(60, 100 - clickCount * 3);
          ctx.fillStyle = `rgb(${tenR},${tenG},${tenB})`;

          for (let j = 0; j < visCount; j++) {
            const p = ten.pts[j];
            p.x = p.baseX + Math.sin(t * p.speed + p.phase) * p.amp;
            p.y = p.baseY + Math.cos(t * p.speed + p.phase) * p.amp;
            ctx.font = p.size + 'px "Courier New", monospace';
            drawPoint(p, t, 0);
          }
        }

        // ── Redirect agitation: points scatter outward ──
        if (redirecting) {
          bodyPoints.forEach(p => {
            p.amp += 0.3;
            p.speed += 0.02;
            const dx = p.baseX - CX;
            const dy = p.baseY - CY;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            p.baseX += (dx / dist) * 0.8;
            p.baseY += (dy / dist) * 0.8;
          });
          tentacles.forEach(ten => {
            ten.pts.forEach(p => {
              p.amp += 0.5;
              const dx = p.baseX - CX;
              const dy = p.baseY - CY;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              p.baseX += (dx / dist) * 1.2;
              p.baseY += (dy / dist) * 1.2;
            });
          });
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
</html>
