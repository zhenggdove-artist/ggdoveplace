<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGdove</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Saint';
      src: url('fonts/saint.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body.landing-body {
      margin: 0;
      overflow: hidden;
      background: #000000;
      cursor: none;
    }

    .landing-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }

    .tilt-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transform: rotateX(var(--tiltX, 0deg)) rotateY(var(--tiltY, 0deg));
      transition: transform 0.15s ease-out;
    }

    /* ── Creature canvas (replaces TV) ── */
    .creature-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(30px);
      z-index: 2;
      cursor: none;
    }

    /* ── SVG orbital curves + nav ── */
    .landing-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      transform: translateZ(0px);
    }
    .landing-svg a {
      pointer-events: all;
      cursor: none;
    }

    .orbit-curve {
      fill: none;
      stroke: rgba(184, 184, 208, 0.16);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .orbit-curl {
      fill: none;
      stroke: rgba(184, 184, 208, 0.12);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    @keyframes shimmerTravel {
      0%   { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: 0; }
    }
    .orbit-shimmer {
      fill: none;
      stroke: rgba(210, 150, 150, 0.18);
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-dasharray: 50 1350;
      animation: shimmerTravel 10s linear infinite;
    }

    .nav-label {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 19.5px;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: #b8b8d0;
      cursor: none;
      transition: fill 0.3s;
    }
    .nav-label:hover { fill: #ffffff; }

    .nav-sub {
      font-family: 'Courier New', monospace;
      font-size: 13.5px;
      font-style: italic;
      fill: #787890;
      letter-spacing: 1px;
    }

    .nav-ornament {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      fill: rgba(184, 184, 208, 0.35);
    }

    .dino-cursor {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 48px;
      height: auto;
      opacity: 0;
      transform: translate(-24px, -24px);
      user-select: none;
    }

    .landing-scanlines {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 6px
      );
    }

    .landing-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.8rem 2rem;
      gap: 1rem;
      cursor: none;
    }

    .ascii-deco {
      font-family: 'Courier New', monospace;
      font-size: 0.975rem;
      color: rgba(120, 120, 144, 0.4);
      white-space: nowrap;
    }

    .landing-artist {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 1.125rem;
      letter-spacing: 0.35em;
      color: rgba(184, 184, 208, 0.7);
      white-space: nowrap;
    }

    /* Click counter */
    .click-counter {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: rgba(120, 120, 144, 0);
      letter-spacing: 3px;
      transition: color 0.5s;
      pointer-events: none;
    }
    .click-counter.visible {
      color: rgba(120, 120, 144, 0.5);
    }

    @media (max-width: 768px) {
      .nav-label { font-size: 15px; letter-spacing: 2px; }
      .nav-sub { font-size: 10.5px; }
      .dino-cursor { display: none; }
      body.landing-body { cursor: auto; }
      .landing-svg a { cursor: auto; }
      .creature-canvas { cursor: auto; }
      .landing-header { padding: 1rem; }
      .ascii-deco { display: none; }
    }
    @media (max-width: 480px) {
      .nav-label { font-size: 13.5px; letter-spacing: 1.5px; }
    }
  </style>
</head>
<body class="landing-body">

        <path class="orbit-curl" d="M 830,235 C 855,210 880,220 875,245 C 870,270 850,275 835,260 C 820,245 825,220 845,212 C 865,204 872,225 852,242 C 840,252 828,240 830,235"/>

        <!-- Navigation Labels -->

        </a>

          <text class="nav-ornament" x="870" y="180" text-anchor="end">&#x2727;</text>
          <text class="nav-label" x="855" y="198" text-anchor="end">Relic</text>
          <text class="nav-sub" x="870" y="218" text-anchor="end">&#x0489;&#x030D;&#x0352; &#x1D4B2;&#x1D4C7;&#x1D4C9;&#x1D4BE;&#x1D4BB;&#x1D4B6;&#x1D4B8;&#x1D4C9;&#x1D4C8;</text>

          <text class="nav-sub" x="870" y="550" text-anchor="end">&#x0489;&#x030D;&#x0352; &#x1D4AE;&#x1D4BD;&#x1D4C4;&#x1D4CC;&#x1D4B8;&#x1D4B6;&#x1D4C8;&#x1D4AE;</text>

          <text class="nav-sub" x="115" y="550">&#x0489;&#x030D;&#x0352; &#x1D4B2;&#x1D4B6;&#x1D4C2;&#x1D4AE;</text>

  <script src="js/main.js"></script>
  <script>
    // ── CMS data ──
    loadData().then(() => {
      applyBackground(siteData.site);
      applyNavHoverColor(siteData.site);
      const artistEl = document.querySelector('.landing-artist');
      if (artistEl && siteData.site && siteData.site.title) {
        artistEl.innerHTML = '\uFF61\uFF65\uFF9F\uFF65\u2727 ' + siteData.site.title + ' \u2727\uFF65\uFF9F\uFF65\uFF61';
      }
      const nl = (siteData.site && siteData.site.navLabels) || {};
      const labels = document.querySelectorAll('.nav-label');
      [nl.bio || 'CV', nl.works || 'Relic', nl.exhibition || 'Exhibition', 'Play']
        .forEach((v, i) => { if (labels[i]) labels[i].textContent = v; });
    });

    // ── 3D Tilt ──
    (function() {
      const scene = document.getElementById('tilt-scene');
      if (!scene) return;
      document.addEventListener('mousemove', function(e) {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        scene.style.setProperty('--tiltY', ((e.clientX - cx) / cx * 6) + 'deg');
        scene.style.setProperty('--tiltX', ((cy - e.clientY) / cy * 3) + 'deg');
      });
      document.addEventListener('mouseleave', function() {
        scene.style.setProperty('--tiltY', '0deg');
        scene.style.setProperty('--tiltX', '0deg');
      });
    })();

    // ── Dino cursor ──
    (function() {
      const cur = document.getElementById('dino-cursor');
      if (!cur || window.innerWidth < 768) return;
      document.addEventListener('mousemove', function(e) {
        cur.style.left = e.clientX + 'px';
        cur.style.top = e.clientY + 'px';
        cur.style.opacity = '1';
      });
      document.addEventListener('mouseleave', function() { cur.style.opacity = '0'; });
      document.addEventListener('mouseenter', function() { cur.style.opacity = '1'; });
    })();

    // ══════════════════════════════════════════════
    //  CREATURE — Tangled curve body + ring-based tentacles
    // ══════════════════════════════════════════════
    (function() {
      const canvas = document.getElementById('creature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = 600, H = 600;
      const CX = W / 2, CY = H / 2;

      let clickCount = 0;
      let scaleMul = 1.0;          // grows 20% each click
      let redirecting = false;
      let redirectTimer = 0;
      const counterEl = document.getElementById('click-counter');

      const GLYPHS = ['.', '\u00B7', '*', 'o', '\u00B0', '+', '\u2022', '\u2219', '\u2727', '@', '\u25E6', '\u2218'];

      // ══════════════════════════════════════
      //  BODY: single long tangled curve
      //  Chaotic Lissajous that self-intersects
      // ══════════════════════════════════════
      const BODY_PTS = 350;
      const bodyPoints = [];

      // Generate a chaotic self-tangling curve using superimposed sinusoids
      const freqX1 = 3 + Math.random() * 2;
      const freqY1 = 2 + Math.random() * 2;
      const freqX2 = 5 + Math.random() * 3;
      const freqY2 = 7 + Math.random() * 2;
      const freqX3 = 11 + Math.random() * 4;
      const freqY3 = 13 + Math.random() * 3;
      const phX1 = Math.random() * Math.PI * 2;
      const phY1 = Math.random() * Math.PI * 2;
      const phX2 = Math.random() * Math.PI * 2;
      const phY2 = Math.random() * Math.PI * 2;

      for (let i = 0; i < BODY_PTS; i++) {
        const t = i / BODY_PTS;
        const angle = t * Math.PI * 2;
        // Superimposed harmonics create tangled self-crossing curve
        const bx = CX
          + Math.sin(angle * freqX1 + phX1) * 80
          + Math.sin(angle * freqX2 + phX2) * 40
          + Math.sin(angle * freqX3) * 20;
        const by = CY
          + Math.cos(angle * freqY1 + phY1) * 80
          + Math.cos(angle * freqY2 + phY2) * 40
          + Math.cos(angle * freqY3) * 20;

        bodyPoints.push({
          baseX: bx, baseY: by,
          x: bx, y: by,
          phase: Math.random() * Math.PI * 2,
          speed: 0.4 + Math.random() * 0.8,
          amp: 1.5 + Math.random() * 3,
          glyph: GLYPHS[Math.floor(Math.random() * 8)],
          size: 7 + Math.random() * 5,
          alpha: 0.4 + Math.random() * 0.4
        });
      }

      // ══════════════════════════════════════
      //  TENTACLE SYSTEM — ring-based, like the GAME
      //  Each tentacle = chain of rings, each ring = circle of dots
      // ══════════════════════════════════════
      const tentacles = [];
      const RINGS_PER_TENTACLE = 50;
      const POINTS_PER_RING = 12;

      function spawnTentacle(ox, oy) {
        // Build a curved spine: 15 control points with spiral deviation
        const baseAngle = Math.random() * Math.PI * 2;
        const totalLen = (80 + Math.random() * 120) * scaleMul;
        const spiralDir = Math.random() < 0.5 ? 1 : -1;
        const spiralStrength = 0.3 + Math.random() * 0.8;
        const curveWiggle = 1.5 + Math.random() * 3;

        // Generate spine points using Catmull-Rom-like control
        const ctrlCount = 15;
        const ctrlPts = [];
        let cx = ox, cy = oy;
        let angle = baseAngle;
        for (let c = 0; c < ctrlCount; c++) {
          const seg = totalLen / ctrlCount;
          // Add spiral drift + randomness
          angle += spiralDir * spiralStrength * (Math.PI / ctrlCount);
          angle += (Math.random() - 0.5) * curveWiggle * (Math.PI / ctrlCount);
          cx += Math.cos(angle) * seg;
          cy += Math.sin(angle) * seg;
          ctrlPts.push({ x: cx, y: cy });
        }

        // Interpolate spine from control points (smooth)
        const spine = [];
        for (let r = 0; r < RINGS_PER_TENTACLE; r++) {
          const u = r / (RINGS_PER_TENTACLE - 1);
          const ci = u * (ctrlPts.length - 1);
          const i0 = Math.floor(ci);
          const i1 = Math.min(i0 + 1, ctrlPts.length - 1);
          const frac = ci - i0;
          spine.push({
            x: ctrlPts[i0].x + (ctrlPts[i1].x - ctrlPts[i0].x) * frac,
            y: ctrlPts[i0].y + (ctrlPts[i1].y - ctrlPts[i0].y) * frac
          });
        }

        // Generate ring-based point cloud
        const rings = [];
        const baseRadius = 10 + Math.random() * 8;
        for (let r = 0; r < RINGS_PER_TENTACLE; r++) {
          const u = r / (RINGS_PER_TENTACLE - 1);
          const ringR = baseRadius * (1.0 - u * 0.85) * scaleMul; // taper to 15% at tip
          const ringPts = [];

          // Compute tangent direction for perpendicular ring
          let tx, ty;
          if (r < RINGS_PER_TENTACLE - 1) {
            tx = spine[r + 1].x - spine[r].x;
            ty = spine[r + 1].y - spine[r].y;
          } else {
            tx = spine[r].x - spine[r - 1].x;
            ty = spine[r].y - spine[r - 1].y;
          }
          // Perpendicular: (-ty, tx) normalized
          const tLen = Math.sqrt(tx * tx + ty * ty) || 1;
          const nx = -ty / tLen;
          const ny = tx / tLen;

          for (let j = 0; j < POINTS_PER_RING; j++) {
            const theta = (j / POINTS_PER_RING) * Math.PI * 2;
            const px = spine[r].x + nx * Math.cos(theta) * ringR;
            const py = spine[r].y + ny * Math.cos(theta) * ringR + Math.sin(theta) * ringR;

            ringPts.push({
              baseX: px, baseY: py,
              x: px, y: py,
              phase: Math.random() * Math.PI * 2,
              speed: 0.5 + Math.random() * 1.5,
              amp: 1 + Math.random() * 3 * (1 - u),
              glyph: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
              size: (6 + Math.random() * 4) * (1 - u * 0.5),
              alpha: 0.6 - u * 0.3,
              ringIdx: r
            });
          }
          rings.push(ringPts);
        }

        tentacles.push({
          rings: rings,
          birth: Date.now(),
          growDuration: 800 + Math.random() * 600,
          totalRings: RINGS_PER_TENTACLE
        });
      }

      // ══════════════════════════════════════
      //  CLICK HANDLING
      // ══════════════════════════════════════
      canvas.addEventListener('click', function(e) {
        if (redirecting) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top) * (H / rect.height);

        // Hit test against body points
        let hit = false;
        for (let i = 0; i < bodyPoints.length; i++) {
          const dx = bodyPoints[i].x - mx;
          const dy = bodyPoints[i].y - my;
          if (dx * dx + dy * dy < 600) { hit = true; break; }
        }
        // Also hit-test tentacle points
        if (!hit) {
          for (let ti = 0; ti < tentacles.length; ti++) {
            for (let ri = 0; ri < tentacles[ti].rings.length; ri++) {
              for (let pi = 0; pi < tentacles[ti].rings[ri].length; pi++) {
                const p = tentacles[ti].rings[ri][pi];
                const dx = p.x - mx, dy = p.y - my;
                if (dx * dx + dy * dy < 600) { hit = true; break; }
              }
              if (hit) break;
            }
            if (hit) break;
          }
        }
        if (!hit) return;

        clickCount++;
        scaleMul *= 1.2; // 20% bigger each click

        // Expand body points outward by scaleMul
        bodyPoints.forEach(p => {
          const dx = p.baseX - CX;
          const dy = p.baseY - CY;
          p.baseX = CX + dx * 1.2;
          p.baseY = CY + dy * 1.2;
          p.amp += 0.5;
          p.speed += 0.04;
        });

        // Spawn tentacles from body positions
        const count = 2 + Math.floor(clickCount * 1.2);
        for (let i = 0; i < count; i++) {
          const bp = bodyPoints[Math.floor(Math.random() * bodyPoints.length)];
          spawnTentacle(bp.x, bp.y);
        }

        if (counterEl) {
          counterEl.textContent = clickCount + ' / 10';
          counterEl.classList.add('visible');
        }

        // At 10 clicks, begin the death/transformation — NOT instant redirect
        if (clickCount >= 10 && !redirecting) {
          redirecting = true;
          redirectTimer = Date.now();
        }
      });

      // ══════════════════════════════════════
      //  ANIMATION LOOP
      // ══════════════════════════════════════
      function animate() {
        const t = Date.now() * 0.001;
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Base color shifts: cool → warm/red with clicks
        const cr = Math.min(255, 184 + clickCount * 8);
        const cg = Math.max(80, 184 - clickCount * 10);
        const cb = Math.max(100, 208 - clickCount * 6);
        const bodyColor = 'rgb(' + cr + ',' + cg + ',' + cb + ')';

        // ── Draw body curve points ──
        ctx.fillStyle = bodyColor;
        for (let i = 0; i < bodyPoints.length; i++) {
          const p = bodyPoints[i];
          p.x = p.baseX + Math.sin(t * p.speed + p.phase) * p.amp * scaleMul;
          p.y = p.baseY + Math.cos(t * p.speed * 0.7 + p.phase + i * 0.005) * p.amp * scaleMul;
          ctx.font = (p.size * Math.min(scaleMul, 2.5)) + 'px "Courier New", monospace';
          ctx.globalAlpha = Math.min(1, p.alpha);
          ctx.fillText(p.glyph, p.x, p.y);
        }

        // ── Draw tentacle ring points ──
        const now = Date.now();
        for (let ti = 0; ti < tentacles.length; ti++) {
          const ten = tentacles[ti];
          const growT = Math.min(1, (now - ten.birth) / ten.growDuration);
          const visRings = Math.floor(ten.totalRings * growT);

          // Tentacle color: root warm → tip hot pink
          for (let r = 0; r < visRings; r++) {
            const u = r / ten.totalRings;
            const tr = Math.min(255, 200 + clickCount * 5 + u * 55);
            const tg = Math.max(0, 100 - clickCount * 5 - u * 80);
            const tb = Math.max(60, 130 - clickCount * 3 - u * 50);
            ctx.fillStyle = 'rgb(' + Math.floor(tr) + ',' + Math.floor(tg) + ',' + Math.floor(tb) + ')';

            const ringPts = ten.rings[r];
            for (let j = 0; j < ringPts.length; j++) {
              const p = ringPts[j];
              p.x = p.baseX + Math.sin(t * p.speed + p.phase) * p.amp;
              p.y = p.baseY + Math.cos(t * p.speed + p.phase) * p.amp;
              ctx.font = (p.size * Math.min(scaleMul, 2.0)) + 'px "Courier New", monospace';
              ctx.globalAlpha = Math.min(1, p.alpha * (1 - (1 - growT) * 0.5));
              ctx.fillText(p.glyph, p.x, p.y);
            }
          }
        }

        // ── Post-10-click: creature evolves, expands, then redirect ──
        if (redirecting) {
          const elapsed = (now - redirectTimer) / 1000; // seconds since trigger

          // Phase 1 (0-3s): rapid expansion + new tentacles burst
          if (elapsed < 3) {
            scaleMul += 0.008;
            bodyPoints.forEach(p => {
              p.amp += 0.08;
              p.speed += 0.003;
              const dx = p.baseX - CX;
              const dy = p.baseY - CY;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              p.baseX += (dx / dist) * 0.6;
              p.baseY += (dy / dist) * 0.6;
            });
            // Occasional burst of new tentacles
            if (Math.random() < 0.08) {
              const bp = bodyPoints[Math.floor(Math.random() * bodyPoints.length)];
              spawnTentacle(bp.x, bp.y);
            }
          }
          // Phase 2 (3-5s): scatter into nothing
          else if (elapsed < 5) {
            const fadeProgress = (elapsed - 3) / 2;
            bodyPoints.forEach(p => {
              p.alpha -= 0.004;
              const dx = p.baseX - CX;
              const dy = p.baseY - CY;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              p.baseX += (dx / dist) * 2.5;
              p.baseY += (dy / dist) * 2.5;
            });
            tentacles.forEach(ten => {
              ten.rings.forEach(ring => {
                ring.forEach(p => {
                  p.alpha -= 0.005;
                  const dx = p.baseX - CX;
                  const dy = p.baseY - CY;
                  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                  p.baseX += (dx / dist) * 3;
                  p.baseY += (dy / dist) * 3;
                });
              });
            });
          }
          // Phase 3: redirect
          else {
            window.location.href = 'GAME/index.html';
            return;
          }
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
