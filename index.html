<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGdove</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Saint';
      src: url('fonts/saint.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body.landing-body {
      margin: 0;
      overflow: hidden;
      background: #000000;
      cursor: none;
    }

    .landing-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }

    .tilt-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transform: rotateX(var(--tiltX, 0deg)) rotateY(var(--tiltY, 0deg));
      transition: transform 0.15s ease-out;
    }

    /* ── Creature canvas (replaces TV) ── */
    .creature-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(30px);
      z-index: 2;
      cursor: none;
    }

    /* ── SVG orbital curves + nav ── */
    .landing-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      transform: translateZ(0px);
    }
    .landing-svg a {
      pointer-events: all;
      cursor: none;
    }

    .orbit-curve {
      fill: none;
      stroke: rgba(184, 184, 208, 0.16);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .orbit-curl {
      fill: none;
      stroke: rgba(184, 184, 208, 0.12);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    @keyframes shimmerTravel {
      0%   { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: 0; }
    }
    .orbit-shimmer {
      fill: none;
      stroke: rgba(210, 150, 150, 0.18);
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-dasharray: 50 1350;
      animation: shimmerTravel 10s linear infinite;
    }

    .nav-label {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 19.5px;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: #b8b8d0;
      cursor: none;
      transition: fill 0.3s;
    }
    .nav-label:hover { fill: #ffffff; }

    .nav-sub {
      font-family: 'Courier New', monospace;
      font-size: 13.5px;
      font-style: italic;
      fill: #787890;
      letter-spacing: 1px;
    }

    .nav-ornament {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      fill: rgba(184, 184, 208, 0.35);
    }

    .dino-cursor {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 48px;
      height: auto;
      opacity: 0;
      transform: translate(-24px, -24px);
      user-select: none;
    }

    .landing-scanlines {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 6px
      );
    }

    .landing-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.8rem 2rem;
      gap: 1rem;
      cursor: none;
    }

    .ascii-deco {
      font-family: 'Courier New', monospace;
      font-size: 0.975rem;
      color: rgba(120, 120, 144, 0.4);
      white-space: nowrap;
    }

    .landing-artist {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 1.125rem;
      letter-spacing: 0.35em;
      color: rgba(184, 184, 208, 0.7);
      white-space: nowrap;
    }

    /* Click counter */
    .click-counter {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: rgba(120, 120, 144, 0);
      letter-spacing: 3px;
      transition: color 0.5s;
      pointer-events: none;
    }
    .click-counter.visible {
      color: rgba(120, 120, 144, 0.5);
    }

    @media (max-width: 768px) {
      .nav-label { font-size: 15px; letter-spacing: 2px; }
      .nav-sub { font-size: 10.5px; }
      .dino-cursor { display: none; }
      body.landing-body { cursor: auto; }
      .landing-svg a { cursor: auto; }
      .creature-canvas { cursor: auto; }
      .landing-header { padding: 1rem; }
      .ascii-deco { display: none; }
    }
    @media (max-width: 480px) {
      .nav-label { font-size: 13.5px; letter-spacing: 1.5px; }
    }
  </style>
</head>

  <script src="js/main.js"></script>
  <script>
    // ── CMS data ──
    loadData().then(() => {
      applyBackground(siteData.site);
      applyNavHoverColor(siteData.site);
      const artistEl = document.querySelector('.landing-artist');
      if (artistEl && siteData.site && siteData.site.title) {
        artistEl.innerHTML = '\uFF61\uFF65\uFF9F\uFF65\u2727 ' + siteData.site.title + ' \u2727\uFF65\uFF9F\uFF65\uFF61';
      }
      const nl = (siteData.site && siteData.site.navLabels) || {};
      const labels = document.querySelectorAll('.nav-label');
      [nl.bio || 'CV', nl.works || 'Relic', nl.exhibition || 'Exhibition', 'Play']
        .forEach((v, i) => { if (labels[i]) labels[i].textContent = v; });
    });

    // ── 3D Tilt ──
    (function() {
      const scene = document.getElementById('tilt-scene');
      if (!scene) return;
      document.addEventListener('mousemove', function(e) {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        scene.style.setProperty('--tiltY', ((e.clientX - cx) / cx * 6) + 'deg');
        scene.style.setProperty('--tiltX', ((cy - e.clientY) / cy * 3) + 'deg');
      });
      document.addEventListener('mouseleave', function() {
        scene.style.setProperty('--tiltY', '0deg');
        scene.style.setProperty('--tiltX', '0deg');
      });
    })();

    // ── Dino cursor ──
    (function() {
      const cur = document.getElementById('dino-cursor');
      if (!cur || window.innerWidth < 768) return;
      document.addEventListener('mousemove', function(e) {
        cur.style.left = e.clientX + 'px';
        cur.style.top = e.clientY + 'px';
        cur.style.opacity = '1';
      });
      document.addEventListener('mouseleave', function() { cur.style.opacity = '0'; });
      document.addEventListener('mouseenter', function() { cur.style.opacity = '1'; });
    })();

    // ══════════════════════════════════════════════
    //  CREATURE — Worm body (donut rings) + donut-ring tentacles
    //  Every ring = a visible circle of dots (like a donut/torus)
    //  Stacked rings along a spine = tentacle or worm segment
    // ══════════════════════════════════════════════
    (function() {
      const canvas = document.getElementById('creature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = 600, H = 600;
      const CX = W / 2, CY = H / 2;

      let clickCount = 0;
      let scaleMul = 1.0;
      let redirecting = false;
      let redirectTimer = 0;
      const counterEl = document.getElementById('click-counter');

      const GLYPHS = ['.', '\u00B7', '\u2022', '\u2219', '\u25E6', '\u2218', 'o', '\u00B0', '*', '+'];

      // ══════════════════════════════════════
      //  Helper: build a spine (curved path) from control points
      // ══════════════════════════════════════
      function buildSpine(ctrlPts, numSegments) {
        const spine = [];
        for (let i = 0; i < numSegments; i++) {
          const u = i / (numSegments - 1);
          const ci = u * (ctrlPts.length - 1);
          const i0 = Math.floor(ci);
          const i1 = Math.min(i0 + 1, ctrlPts.length - 1);
          const f = ci - i0;
          spine.push({
            x: ctrlPts[i0].x + (ctrlPts[i1].x - ctrlPts[i0].x) * f,
            y: ctrlPts[i0].y + (ctrlPts[i1].y - ctrlPts[i0].y) * f
          });
        }
        return spine;
      }

      // ══════════════════════════════════════
      //  Helper: generate donut rings along a spine
      //  Each ring = circle of dots perpendicular to spine direction
      //  tiltAngle simulates 3D viewing angle of each donut
      // ══════════════════════════════════════
      function generateRings(spine, baseRadius, taperEnd, ptsPerRing, dotSize, dotAlpha) {
        const rings = [];
        for (let r = 0; r < spine.length; r++) {
          const u = r / (spine.length - 1);
          const ringR = baseRadius * (1.0 - u * taperEnd);
          const ringPts = [];

          // Tangent direction
          let tx, ty;
          if (r < spine.length - 1) {
            tx = spine[r + 1].x - spine[r].x;
            ty = spine[r + 1].y - spine[r].y;
          } else {
            tx = spine[r].x - spine[r - 1].x;
            ty = spine[r].y - spine[r - 1].y;
          }
          const tLen = Math.sqrt(tx * tx + ty * ty) || 1;
          const nx = -ty / tLen; // perpendicular
          const ny = tx / tLen;

          // Each ring is an ellipse (donut seen at an angle)
          // The "depth" axis is compressed to simulate 3D tilt
          const tiltCompress = 0.3 + Math.abs(ny) * 0.5; // how squished the donut looks

          for (let j = 0; j < ptsPerRing; j++) {
            const theta = (j / ptsPerRing) * Math.PI * 2;
            // Donut ring: points arranged in a circle
            // X-component along perpendicular, Y-component is "depth" (compressed)
            const px = spine[r].x + Math.cos(theta) * ringR * nx - Math.sin(theta) * ringR * tiltCompress * tx / tLen;
            const py = spine[r].y + Math.cos(theta) * ringR * ny - Math.sin(theta) * ringR * tiltCompress * ty / tLen;

            ringPts.push({
              baseX: px, baseY: py,
              x: px, y: py,
              phase: Math.random() * Math.PI * 2,
              speed: 0.3 + Math.random() * 1.0,
              amp: 0.5 + Math.random() * 2 * (1 - u * 0.5),
              glyph: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
              size: dotSize * (1 - u * 0.4),
              alpha: dotAlpha * (1 - u * 0.3)
            });
          }
          rings.push(ringPts);
        }
        return rings;
      }

      // ══════════════════════════════════════
      //  BODY: writhing worm/bacteria made of donut rings
      //  A single sinuous spine with visible ring segments
      // ══════════════════════════════════════
      const BODY_RINGS = 60;
      const BODY_PTS_PER_RING = 16;

      // Worm spine: S-shaped writhing curve through center
      const bodyCtrl = [];
      const bodyCtrlCount = 12;
      for (let i = 0; i < bodyCtrlCount; i++) {
        const t = i / (bodyCtrlCount - 1);
        // S-curve with some chaos
        bodyCtrl.push({
          x: CX + Math.sin(t * Math.PI * 3.5) * 60 + Math.sin(t * 7) * 25,
          y: CY - 90 + t * 180 + Math.cos(t * Math.PI * 2.5) * 30
        });
      }
      const bodySpine = buildSpine(bodyCtrl, BODY_RINGS);
      const bodyRings = generateRings(bodySpine, 18, 0.6, BODY_PTS_PER_RING, 6, 0.6);

      // Store original spine for animation
      const bodySpineBase = bodySpine.map(p => ({ x: p.x, y: p.y }));
      // Worm animation params
      const wormPhase = Math.random() * Math.PI * 2;
      const wormFreq = 2 + Math.random() * 2;
      const wormAmp = 12 + Math.random() * 8;

      // ══════════════════════════════════════
      //  TENTACLE SYSTEM — donut ring stacks growing from body
      // ══════════════════════════════════════
      const tentacles = [];
      const TENT_RINGS = 40;
      const TENT_PTS_PER_RING = 14;

      function spawnTentacle(ox, oy) {
        const baseAngle = Math.random() * Math.PI * 2;
        const totalLen = (100 + Math.random() * 140) * scaleMul;
        const spiralDir = Math.random() < 0.5 ? 1 : -1;
        const spiralStr = 0.4 + Math.random() * 1.0;
        const wiggle = 2 + Math.random() * 3;

        // Build spine control points
        const ctrlCount = 20;
        const ctrls = [{ x: ox, y: oy }];
        let cx = ox, cy = oy, angle = baseAngle;
        for (let c = 0; c < ctrlCount; c++) {
          const seg = totalLen / ctrlCount;
          angle += spiralDir * spiralStr * (Math.PI / ctrlCount);
          angle += (Math.random() - 0.5) * wiggle * (Math.PI / ctrlCount);
          cx += Math.cos(angle) * seg;
          cy += Math.sin(angle) * seg;
          ctrls.push({ x: cx, y: cy });
        }

        const spine = buildSpine(ctrls, TENT_RINGS);
        const baseR = (8 + Math.random() * 10) * scaleMul;
        const rings = generateRings(spine, baseR, 0.85, TENT_PTS_PER_RING, 5, 0.55);

        // Random color: cyan, magenta, green, or white
        const palettes = [
          [0, 255, 220],   // cyan
          [255, 0, 180],   // magenta/pink
          [0, 220, 80],    // green
          [200, 200, 230]  // pale white
        ];
        const pal = palettes[Math.floor(Math.random() * palettes.length)];

        tentacles.push({
          rings: rings,
          spine: spine,
          spineBase: spine.map(p => ({ x: p.x, y: p.y })),
          birth: Date.now(),
          growDuration: 1200 + Math.random() * 800,
          totalRings: TENT_RINGS,
          color: pal,
          wrigglePhase: Math.random() * Math.PI * 2,
          wriggleFreq: 1.5 + Math.random() * 2,
          wriggleAmp: 6 + Math.random() * 10
        });
      }

      // ══════════════════════════════════════
      //  CLICK HANDLING
      // ══════════════════════════════════════
      function getAllPoints() {
        const pts = [];
        bodyRings.forEach(ring => ring.forEach(p => pts.push(p)));
        tentacles.forEach(t => t.rings.forEach(ring => ring.forEach(p => pts.push(p))));
        return pts;
      }

      canvas.addEventListener('click', function(e) {
        if (redirecting) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top) * (H / rect.height);

        // Hit test
        let hit = false;
        const allPts = getAllPoints();
        for (let i = 0; i < allPts.length; i++) {
          const dx = allPts[i].x - mx, dy = allPts[i].y - my;
          if (dx * dx + dy * dy < 800) { hit = true; break; }
        }
        if (!hit) return;

        clickCount++;
        scaleMul *= 1.2;

        // Expand body
        for (let i = 0; i < bodySpineBase.length; i++) {
          const dx = bodySpineBase[i].x - CX;
          const dy = bodySpineBase[i].y - CY;
          bodySpineBase[i].x = CX + dx * 1.2;
          bodySpineBase[i].y = CY + dy * 1.2;
        }

        // Spawn tentacles from body spine positions
        const count = 2 + Math.floor(clickCount * 1.5);
        for (let i = 0; i < count; i++) {
          const si = Math.floor(Math.random() * bodySpine.length);
          spawnTentacle(bodySpine[si].x, bodySpine[si].y);
        }

        if (counterEl) {
          counterEl.textContent = clickCount + ' / 10';
          counterEl.classList.add('visible');
        }

        if (clickCount >= 10 && !redirecting) {
          redirecting = true;
          redirectTimer = Date.now();
        }
      });

      // ══════════════════════════════════════
      //  DRAW: render a set of rings as dots
      // ══════════════════════════════════════
      function drawRings(rings, visCount, color, t, extraScale) {
        const sc = extraScale || 1;
        for (let r = 0; r < visCount; r++) {
          const u = r / rings.length;
          // Color gradient along length
          const cr = Math.min(255, Math.floor(color[0] * (1 - u * 0.3)));
          const cg = Math.min(255, Math.floor(color[1] * (1 - u * 0.2)));
          const cb = Math.min(255, Math.floor(color[2] * (1 - u * 0.1)));
          ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';

          const ring = rings[r];
          for (let j = 0; j < ring.length; j++) {
            const p = ring[j];
            ctx.globalAlpha = Math.min(1, p.alpha);
            ctx.font = Math.max(2, p.size * sc) + 'px "Courier New", monospace';
            ctx.fillText(p.glyph, p.x, p.y);
          }
        }
      }

      // ══════════════════════════════════════
      //  Rebuild body rings from animated spine
      // ══════════════════════════════════════
      function rebuildBodyRings(spine) {
        const baseR = 18 * scaleMul;
        for (let r = 0; r < spine.length; r++) {
          const u = r / (spine.length - 1);
          const ringR = baseR * (1.0 - u * 0.6);

          let tx, ty;
          if (r < spine.length - 1) {
            tx = spine[r + 1].x - spine[r].x;
            ty = spine[r + 1].y - spine[r].y;
          } else {
            tx = spine[r].x - spine[r - 1].x;
            ty = spine[r].y - spine[r - 1].y;
          }
          const tLen = Math.sqrt(tx * tx + ty * ty) || 1;
          const nx = -ty / tLen;
          const ny = tx / tLen;
          const tiltC = 0.3 + Math.abs(ny) * 0.5;

          const ring = bodyRings[r];
          if (!ring) continue;
          for (let j = 0; j < ring.length; j++) {
            const theta = (j / ring.length) * Math.PI * 2;
            const p = ring[j];
            p.baseX = spine[r].x + Math.cos(theta) * ringR * nx - Math.sin(theta) * ringR * tiltC * tx / tLen;
            p.baseY = spine[r].y + Math.cos(theta) * ringR * ny - Math.sin(theta) * ringR * tiltC * ty / tLen;
          }
        }
      }

      // ══════════════════════════════════════
      //  Rebuild tentacle rings from animated spine
      // ══════════════════════════════════════
      function rebuildTentRings(ten) {
        const baseR = (8 + 5) * scaleMul; // approximate
        for (let r = 0; r < ten.spine.length; r++) {
          const u = r / (ten.spine.length - 1);
          const ringR = baseR * (1.0 - u * 0.85);

          let tx, ty;
          if (r < ten.spine.length - 1) {
            tx = ten.spine[r + 1].x - ten.spine[r].x;
            ty = ten.spine[r + 1].y - ten.spine[r].y;
          } else {
            tx = ten.spine[r].x - ten.spine[r - 1].x;
            ty = ten.spine[r].y - ten.spine[r - 1].y;
          }
          const tLen = Math.sqrt(tx * tx + ty * ty) || 1;
          const nx = -ty / tLen;
          const ny = tx / tLen;
          const tiltC = 0.3 + Math.abs(ny) * 0.5;

          const ring = ten.rings[r];
          if (!ring) continue;
          for (let j = 0; j < ring.length; j++) {
            const theta = (j / ring.length) * Math.PI * 2;
            const p = ring[j];
            p.baseX = ten.spine[r].x + Math.cos(theta) * ringR * nx - Math.sin(theta) * ringR * tiltC * tx / tLen;
            p.baseY = ten.spine[r].y + Math.cos(theta) * ringR * ny - Math.sin(theta) * ringR * tiltC * ty / tLen;
          }
        }
      }

      // ══════════════════════════════════════
      //  ANIMATION LOOP
      // ══════════════════════════════════════
      function animate() {
        const t = Date.now() * 0.001;
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // ── Animate body spine: writhing worm ──
        for (let i = 0; i < bodySpine.length; i++) {
          const u = i / bodySpine.length;
          // Sine wave travels along the worm body
          const wave = Math.sin(t * wormFreq + u * Math.PI * 4 + wormPhase);
          const wave2 = Math.cos(t * wormFreq * 0.7 + u * Math.PI * 3);
          bodySpine[i].x = bodySpineBase[i].x + wave * wormAmp * scaleMul;
          bodySpine[i].y = bodySpineBase[i].y + wave2 * wormAmp * 0.5 * scaleMul;
        }
        rebuildBodyRings(bodySpine);

        // Update body ring point positions with micro-jitter
        bodyRings.forEach(ring => {
          ring.forEach(p => {
            p.x = p.baseX + Math.sin(t * p.speed + p.phase) * p.amp;
            p.y = p.baseY + Math.cos(t * p.speed * 0.7 + p.phase) * p.amp;
          });
        });

        // Body color
        const cr = Math.min(255, 180 + clickCount * 8);
        const cg = Math.max(80, 220 - clickCount * 12);
        const cb = Math.max(100, 230 - clickCount * 8);
        drawRings(bodyRings, bodyRings.length, [cr, cg, cb], t, Math.min(scaleMul, 2.5));

        // ── Animate & draw tentacles ──
        const now = Date.now();
        for (let ti = 0; ti < tentacles.length; ti++) {
          const ten = tentacles[ti];
          const growT = Math.min(1, (now - ten.birth) / ten.growDuration);
          const visRings = Math.floor(ten.totalRings * growT);

          // Wriggle the tentacle spine
          for (let i = 0; i < ten.spine.length; i++) {
            const u = i / ten.spine.length;
            const wave = Math.sin(t * ten.wriggleFreq + u * Math.PI * 5 + ten.wrigglePhase);
            const wave2 = Math.cos(t * ten.wriggleFreq * 0.6 + u * Math.PI * 3 + ten.wrigglePhase);
            ten.spine[i].x = ten.spineBase[i].x + wave * ten.wriggleAmp * u;
            ten.spine[i].y = ten.spineBase[i].y + wave2 * ten.wriggleAmp * 0.6 * u;
          }
          rebuildTentRings(ten);

          // Update ring point positions
          ten.rings.forEach(ring => {
            ring.forEach(p => {
              p.x = p.baseX + Math.sin(t * p.speed + p.phase) * p.amp;
              p.y = p.baseY + Math.cos(t * p.speed * 0.7 + p.phase) * p.amp;
            });
          });

          drawRings(ten.rings, visRings, ten.color, t, Math.min(scaleMul, 2.0));
        }

        // ── Post-10-click: evolve → scatter → redirect ──
        if (redirecting) {
          const elapsed = (now - redirectTimer) / 1000;

          if (elapsed < 3) {
            // Phase 1: rapid expansion, burst tentacles
            scaleMul += 0.01;
            wormAmp * 1.01;
            if (Math.random() < 0.1) {
              const si = Math.floor(Math.random() * bodySpine.length);
              spawnTentacle(bodySpine[si].x, bodySpine[si].y);
            }
          } else if (elapsed < 5.5) {
            // Phase 2: scatter all points outward, fade
            const allPts = getAllPoints();
            allPts.forEach(p => {
              p.alpha = Math.max(0, p.alpha - 0.003);
              const dx = p.baseX - CX;
              const dy = p.baseY - CY;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              p.baseX += (dx / dist) * 2;
              p.baseY += (dy / dist) * 2;
            });
            // Also push spines outward
            bodySpineBase.forEach(p => {
              const dx = p.x - CX, dy = p.y - CY;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              p.x += (dx / dist) * 1.5;
              p.y += (dy / dist) * 1.5;
            });
            tentacles.forEach(ten => {
              ten.spineBase.forEach(p => {
                const dx = p.x - CX, dy = p.y - CY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                p.x += (dx / dist) * 2;
                p.y += (dy / dist) * 2;
              });
            });
          } else {
            window.location.href = 'GAME/index.html';
            return;
          }
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
