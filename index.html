<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGdove</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Saint';
      src: url('fonts/saint.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body.landing-body {
      margin: 0;
      overflow: hidden;
      background: #000000;
      cursor: none;
    }

    .landing-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }

    .tilt-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transform: rotateX(var(--tiltX, 0deg)) rotateY(var(--tiltY, 0deg));
      transition: transform 0.15s ease-out;
    }

    /* ── Creature canvas (replaces TV) ── */
    .creature-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(30px);
      z-index: 2;
      cursor: none;
    }

    /* ── Orbit ASCII canvas (replaces SVG curves) ── */
    .orbit-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      transform: translateZ(0px);
    }

    /* ── SVG nav labels only ── */
    .landing-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      transform: translateZ(0px);
    }
    .landing-svg a {
      pointer-events: all;
      cursor: none;
    }
    .landing-svg text {
      pointer-events: all;
    }

    .nav-label {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 19.5px;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: #b8b8d0;
      cursor: none;
      transition: fill 0.3s;
    }
    .nav-label:hover { fill: #ffffff; }

    .nav-sub {
      font-family: 'Courier New', monospace;
      font-size: 13.5px;
      font-style: italic;
      fill: #787890;
      letter-spacing: 1px;
    }

    .nav-ornament {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      fill: rgba(184, 184, 208, 0.35);
    }

    .dino-cursor {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 48px;
      height: auto;
      opacity: 0;
      transform: translate(-24px, -24px);
      user-select: none;
    }

    .landing-scanlines {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 6px
      );
    }

    .landing-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.8rem 2rem;
      gap: 1rem;
      cursor: none;
    }

    .ascii-deco {
      font-family: 'Courier New', monospace;
      font-size: 0.975rem;
      color: rgba(120, 120, 144, 0.4);
      white-space: nowrap;
    }

    .landing-artist {
      font-family: 'Saint', 'Courier New', monospace;
      font-size: 1.125rem;
      letter-spacing: 0.35em;
      color: rgba(184, 184, 208, 0.7);
      white-space: nowrap;
    }

    /* Click counter */
    .click-counter {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: rgba(120, 120, 144, 0);
      letter-spacing: 3px;
      transition: color 0.5s;
      pointer-events: none;
    }
    .click-counter.visible {
      color: rgba(120, 120, 144, 0.5);
    }

    @media (max-width: 768px) {
      .nav-label { font-size: 30px; letter-spacing: 3px; }
      .nav-sub { font-size: 16px; }
      .nav-ornament { font-size: 22px; }
      .dino-cursor { display: none; }
      body.landing-body { cursor: auto; }
      .landing-svg { pointer-events: auto; }
      .landing-svg a { cursor: pointer; pointer-events: auto; }
      .landing-svg text { pointer-events: auto; cursor: pointer; }
      .creature-canvas { cursor: auto; }
      .landing-header { padding: 1rem; }
      .ascii-deco { display: none; }
    }
    @media (max-width: 480px) {
      .nav-label { font-size: 26px; letter-spacing: 2px; }
      .nav-sub { font-size: 14px; }
    }
  </style>
</head>
<body class="landing-body">
  <div class="landing-scanlines"></div>

  <div class="landing-header">
    <span class="ascii-deco">o()xxxx[{:::::::::::::::::::></span>
    <span class="landing-artist">&#xFF61;&#xFF65;&#xFF9F;&#xFF65;&#x2727; GGdove &#x2727;&#xFF65;&#xFF9F;&#xFF65;&#xFF61;</span>
    <span class="ascii-deco">&lt;:::::::::::::::::::}]xxxx()o</span>
  </div>

  <img id="dino-cursor" class="dino-cursor" src="images/cursor-dino.png" alt="" aria-hidden="true">

  <div class="click-counter" id="click-counter"></div>

  <div class="landing-wrap">
    <div class="tilt-scene" id="tilt-scene">

      <!-- Creature canvas (replaces TV) -->
      <canvas class="creature-canvas" id="creature-canvas" width="600" height="600"></canvas>

      <!-- Orbit curves rendered as ASCII on canvas -->
      <canvas class="orbit-canvas" id="orbit-canvas"></canvas>

      <!-- SVG navigation labels only -->
      <svg class="landing-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
        <!-- Navigation Labels -->
        <a href="bio.html">
          <text class="nav-ornament" x="115" y="180">&#x2727;</text>
          <text class="nav-label" x="135" y="198">CV</text>
          <text class="nav-sub" x="115" y="218">&#x0489;&#x030D;&#x0352;&#x0357; &#x1D4AB;&#x1D4C1;&#x1D4B8;&#x1D4BB;&#x1D4BE;&#x1D4C1;&#x1D4AE;</text>
        </a>
        <a href="relic.html">
          <text class="nav-ornament" x="870" y="180" text-anchor="end">&#x2727;</text>
          <text class="nav-label" x="855" y="198" text-anchor="end">Relic</text>
          <text class="nav-sub" x="870" y="218" text-anchor="end">&#x0489;&#x030D;&#x0352; &#x1D4B2;&#x1D4C7;&#x1D4C9;&#x1D4BE;&#x1D4BB;&#x1D4B6;&#x1D4B8;&#x1D4C9;&#x1D4C8;</text>
        </a>
        <a href="exhibition.html">
          <text class="nav-ornament" x="870" y="512" text-anchor="end">&#x2727;</text>
          <text class="nav-label" x="855" y="530" text-anchor="end">Exhibition</text>
          <text class="nav-sub" x="870" y="550" text-anchor="end">&#x0489;&#x030D;&#x0352; &#x1D4AE;&#x1D4BD;&#x1D4C4;&#x1D4CC;&#x1D4B8;&#x1D4B6;&#x1D4C8;&#x1D4AE;</text>
        </a>
        <a href="play.html">
          <text class="nav-ornament" x="115" y="512">&#x2727;</text>
          <text class="nav-label" x="135" y="530">Play</text>
          <text class="nav-sub" x="115" y="550">&#x0489;&#x030D;&#x0352; &#x1D4B2;&#x1D4B6;&#x1D4C2;&#x1D4AE;</text>
        </a>
      </svg>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // ── CMS data ──
    loadData().then(() => {
      applyBackground(siteData.site);
      applyNavHoverColor(siteData.site);
      const artistEl = document.querySelector('.landing-artist');
      if (artistEl && siteData.site && siteData.site.title) {
        artistEl.innerHTML = '\uFF61\uFF65\uFF9F\uFF65\u2727 ' + siteData.site.title + ' \u2727\uFF65\uFF9F\uFF65\uFF61';
      }
      const nl = (siteData.site && siteData.site.navLabels) || {};
      const labels = document.querySelectorAll('.nav-label');
      [nl.bio || 'CV', nl.works || 'Relic', nl.exhibition || 'Exhibition', 'Play']
        .forEach((v, i) => { if (labels[i]) labels[i].textContent = v; });
    });

    // ── 3D Tilt ──
    (function() {
      const scene = document.getElementById('tilt-scene');
      if (!scene) return;
      document.addEventListener('mousemove', function(e) {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        scene.style.setProperty('--tiltY', ((e.clientX - cx) / cx * 6) + 'deg');
        scene.style.setProperty('--tiltX', ((cy - e.clientY) / cy * 3) + 'deg');
      });
      document.addEventListener('mouseleave', function() {
        scene.style.setProperty('--tiltY', '0deg');
        scene.style.setProperty('--tiltX', '0deg');
      });
    })();

    // ── Dino cursor ──
    (function() {
      const cur = document.getElementById('dino-cursor');
      if (!cur || window.innerWidth < 768) return;
      document.addEventListener('mousemove', function(e) {
        cur.style.left = e.clientX + 'px';
        cur.style.top = e.clientY + 'px';
        cur.style.opacity = '1';
      });
      document.addEventListener('mouseleave', function() { cur.style.opacity = '0'; });
      document.addEventListener('mouseenter', function() { cur.style.opacity = '1'; });
    })();

    // ══════════════════════════════════════════════
    //  ORBIT CURVES — rendered as ASCII dot particles
    //  OPTIMIZED: no DPR scaling, pre-cached fonts, reduced density
    // ══════════════════════════════════════════════
    var orbitCtx, orbitW, orbitH, orbitPts, shimmerPts, orbitCurves;
    (function() {
      const oc = document.getElementById('orbit-canvas');
      if (!oc) return;
      orbitCtx = oc.getContext('2d');
      const OGLYPHS = ['.', '\u00B7', '\u2022', '\u2219', '\u25E6', '+', '*', 'o'];

      function resizeOrbit() {
        // No DPR scaling — massive perf improvement
        oc.width = oc.offsetWidth;
        oc.height = oc.offsetHeight;
        orbitW = oc.width; orbitH = oc.height;
      }
      resizeOrbit();
      window.addEventListener('resize', resizeOrbit);

      function cubicBez(p0, p1, p2, p3, t) {
        const u = 1-t;
        return {
          x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
          y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
        };
      }

      function seg(x0,y0,x1,y1,x2,y2,x3,y3) {
        return { p0:{x:x0,y:y0}, p1:{x:x1,y:y1}, p2:{x:x2,y:y2}, p3:{x:x3,y:y3} };
      }
      orbitCurves = [
        [seg(.17,.335, .20,.19, .28,.08, .35,.18), seg(.35,.18, .42,.28, .33,.07, .46,.05),
         seg(.46,.05, .59,.03, .50,.22, .58,.11), seg(.58,.11, .66,.00, .68,.25, .74,.15),
         seg(.74,.15, .80,.05, .85,.25, .83,.335)],
        [seg(.83,.335, .92,.29, .97,.36, .94,.44), seg(.94,.44, .91,.52, .98,.48, .97,.54),
         seg(.97,.54, .96,.60, .93,.56, .95,.62), seg(.95,.62, .97,.68, .91,.67, .87,.65),
         seg(.87,.65, .83,.63, .85,.70, .83,.693)],
        [seg(.83,.693, .79,.79, .74,.88, .67,.82), seg(.67,.82, .60,.76, .66,.91, .57,.92),
         seg(.57,.92, .48,.93, .52,.77, .44,.84), seg(.44,.84, .36,.91, .34,.76, .28,.81),
         seg(.28,.81, .22,.86, .21,.74, .19,.70), seg(.19,.70, .17,.66, .17,.69, .17,.693)],
        [seg(.17,.693, .10,.66, .03,.62, .06,.54), seg(.06,.54, .09,.46, .02,.50, .01,.44),
         seg(.01,.44, .00,.38, .05,.40, .03,.35), seg(.03,.35, .01,.30, .06,.33, .09,.36),
         seg(.09,.36, .12,.39, .10,.30, .14,.32), seg(.14,.32, .18,.34, .16,.33, .17,.335)],
        [seg(.25,.20, .38,.35, .22,.42, .40,.38), seg(.40,.38, .58,.34, .35,.52, .25,.45)],
        [seg(.75,.20, .62,.35, .78,.42, .60,.38), seg(.60,.38, .42,.34, .65,.52, .75,.45)],
        [seg(.38,.14, .52,.24, .44,.34, .52,.28), seg(.52,.28, .60,.22, .62,.32, .52,.36)],
        [seg(.62,.82, .48,.72, .56,.62, .48,.68), seg(.48,.68, .40,.74, .38,.64, .48,.60)]
      ];

      orbitPts = [];
      var DENSITY = 35;
      orbitCurves.forEach(function(segs, ci) {
        segs.forEach(function(s) {
          for (var i = 0; i <= DENSITY; i++) {
            var t = i / DENSITY;
            var pt = cubicBez(s.p0, s.p1, s.p2, s.p3, t);
            var sz = 7 + Math.floor(Math.random()*5);
            orbitPts.push({
              nx: pt.x, ny: pt.y,
              glyph: OGLYPHS[Math.floor(Math.random()*OGLYPHS.length)],
              phase: Math.random()*6.28,
              speed: 0.15+Math.random()*0.4,
              amp: 0.5+Math.random()*2,
              alpha: ci<4 ? (0.25+Math.random()*0.25) : (0.15+Math.random()*0.2),
              font: sz+'px monospace',
              ci: ci
            });
          }
        });
      });

      shimmerPts = [];
      orbitCurves.slice(0,4).forEach(function(segs, ci) {
        for (var i=0;i<8;i++) {
          shimmerPts.push({
            segs:segs, progress:Math.random(),
            speed:0.02+Math.random()*0.025,
            glyph:'\u2727', font:'10px monospace', alpha:0.5
          });
        }
      });
    })();

    // ══════════════════════════════════════════════
    //  CREATURE — Thin worm body + thin donut-ring tentacles
    //  Halved sizes, more chaotic motion, tentacles from click point
    // ══════════════════════════════════════════════
    (function() {
      const canvas = document.getElementById('creature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = 600, H = 600;
      const CX = W / 2, CY = H / 2;

      let clickCount = 0;
      let scaleMul = 1.0;
      let redirecting = false;
      let redirectTimer = 0;
      const counterEl = document.getElementById('click-counter');

      const GLYPHS = ['.', '\u00B7', '\u2022', '\u2219', '\u25E6', '\u2218', 'o', '\u00B0', '*', '+'];

      // ── Helper: build spine from control points ──
      function buildSpine(ctrlPts, numSeg) {
        const spine = [];
        for (let i = 0; i < numSeg; i++) {
          const u = i / (numSeg - 1);
          const ci = u * (ctrlPts.length - 1);
          const i0 = Math.floor(ci);
          const i1 = Math.min(i0 + 1, ctrlPts.length - 1);
          const f = ci - i0;
          spine.push({
            x: ctrlPts[i0].x + (ctrlPts[i1].x - ctrlPts[i0].x) * f,
            y: ctrlPts[i0].y + (ctrlPts[i1].y - ctrlPts[i0].y) * f
          });
        }
        return spine;
      }

      // ── Helper: generate donut rings along spine ──
      function generateRings(spine, baseR, taperEnd, ptsPerRing, dotSize, dotAlpha) {
        const rings = [];
        for (let r = 0; r < spine.length; r++) {
          const u = r / (spine.length - 1);
          const ringR = baseR * (1.0 - u * taperEnd);
          const ringPts = [];
          let tx, ty;
          if (r < spine.length - 1) { tx = spine[r+1].x - spine[r].x; ty = spine[r+1].y - spine[r].y; }
          else { tx = spine[r].x - spine[r-1].x; ty = spine[r].y - spine[r-1].y; }
          const tLen = Math.sqrt(tx*tx+ty*ty) || 1;
          const nx = -ty/tLen, ny = tx/tLen;
          const tiltC = 0.3 + Math.abs(ny) * 0.5;
          for (let j = 0; j < ptsPerRing; j++) {
            const theta = (j / ptsPerRing) * Math.PI * 2;
            ringPts.push({
              baseX: spine[r].x + Math.cos(theta)*ringR*nx - Math.sin(theta)*ringR*tiltC*tx/tLen,
              baseY: spine[r].y + Math.cos(theta)*ringR*ny - Math.sin(theta)*ringR*tiltC*ty/tLen,
              x: 0, y: 0,
              phase: Math.random()*Math.PI*2,
              speed: 0.3+Math.random()*1.0,
              amp: 0.3+Math.random()*1.5*(1-u*0.5),
              glyph: GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
              size: dotSize*(1-u*0.4),
              alpha: dotAlpha*(1-u*0.3)
            });
          }
          rings.push(ringPts);
        }
        return rings;
      }

      // ══════════════════════════════════════
      //  BODY — thin writhing worm (radius halved: 8px)
      //  More chaotic multi-frequency spine
      // ══════════════════════════════════════
      const BODY_RINGS = 55;
      const BODY_PTS_RING = 10;
      const bodyCtrl = [];
      const bodyCtrlN = 16; // more control points = more irregular
      for (let i = 0; i < bodyCtrlN; i++) {
        const t = i / (bodyCtrlN - 1);
        bodyCtrl.push({
          x: CX + Math.sin(t*Math.PI*4.2)*18 + Math.sin(t*11.3)*9 + Math.cos(t*7.7)*6,
          y: CY - 35 + t*70 + Math.cos(t*Math.PI*3.1)*10 + Math.sin(t*8.5)*5
        });
      }
      const bodySpine = buildSpine(bodyCtrl, BODY_RINGS);
      const bodyRings = generateRings(bodySpine, 4, 0.7, BODY_PTS_RING, 2, 0.6);
      const bodySpineBase = bodySpine.map(p => ({x:p.x, y:p.y}));

      // Worm animation — multiple layered frequencies for irregular motion
      const wormPhases = [];
      for (let i = 0; i < 4; i++) {
        wormPhases.push({
          freq: 1.5 + Math.random()*2.5,
          amp: 2 + Math.random()*4,
          phase: Math.random()*Math.PI*2,
          spatialFreq: 3 + Math.random()*4
        });
      }

      // ══════════════════════════════════════
      //  TENTACLES — thin donut rings (radius halved: ~4px)
      // ══════════════════════════════════════
      const tentacles = [];
      const TENT_RINGS = 35;
      const TENT_PTS_RING = 10;

      function spawnTentacle(ox, oy) {
        const baseAngle = Math.random()*Math.PI*2;
        const totalLen = (30 + Math.random()*40) * scaleMul;
        const spiralDir = Math.random()<0.5 ? 1 : -1;
        const spiralStr = 0.5+Math.random()*1.2;
        const wiggle = 2+Math.random()*4;

        const ctrlCount = 18;
        const ctrls = [{x:ox, y:oy}];
        let cx = ox, cy = oy, angle = baseAngle;
        for (let c = 0; c < ctrlCount; c++) {
          const seg = totalLen/ctrlCount;
          angle += spiralDir*spiralStr*(Math.PI/ctrlCount);
          angle += (Math.random()-0.5)*wiggle*(Math.PI/ctrlCount);
          cx += Math.cos(angle)*seg;
          cy += Math.sin(angle)*seg;
          ctrls.push({x:cx, y:cy});
        }

        const spine = buildSpine(ctrls, TENT_RINGS);
        const baseR = (1.5 + Math.random()*2) * scaleMul;
        const rings = generateRings(spine, baseR, 0.85, TENT_PTS_RING, 1.5, 0.5);

        const palettes = [[0,255,220],[255,0,180],[0,220,80],[200,200,230]];
        const pal = palettes[Math.floor(Math.random()*palettes.length)];

        tentacles.push({
          rings: rings, spine: spine,
          spineBase: spine.map(p => ({x:p.x, y:p.y})),
          birth: Date.now(), growDuration: 300+Math.random()*200,
          totalRings: TENT_RINGS, color: pal, baseR: baseR,
          wrigglePhase: Math.random()*Math.PI*2,
          wriggleFreq: 1.5+Math.random()*2.5,
          wriggleAmp: 2+Math.random()*4
        });
      }

      // ── Find nearest body spine point to click ──
      function nearestBodySpineIdx(mx, my) {
        let best = 0, bestD = Infinity;
        for (let i = 0; i < bodySpine.length; i++) {
          const dx = bodySpine[i].x - mx, dy = bodySpine[i].y - my;
          const d = dx*dx + dy*dy;
          if (d < bestD) { bestD = d; best = i; }
        }
        return best;
      }

      // ── Click: tentacles grow from nearest body point to click ──
      function getAllPoints() {
        const pts = [];
        bodyRings.forEach(r => r.forEach(p => pts.push(p)));
        tentacles.forEach(t => t.rings.forEach(r => r.forEach(p => pts.push(p))));
        return pts;
      }

      canvas.addEventListener('click', function(e) {
        if (redirecting) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX-rect.left)*(W/rect.width);
        const my = (e.clientY-rect.top)*(H/rect.height);

        // Hit test
        let hit = false;
        const allPts = getAllPoints();
        for (let i = 0; i < allPts.length; i++) {
          const dx = allPts[i].x-mx, dy = allPts[i].y-my;
          if (dx*dx+dy*dy < 800) { hit = true; break; }
        }
        if (!hit) return;

        clickCount++;
        scaleMul *= 1.2;

        // Expand body spine
        for (let i = 0; i < bodySpineBase.length; i++) {
          const dx = bodySpineBase[i].x-CX, dy = bodySpineBase[i].y-CY;
          bodySpineBase[i].x = CX+dx*1.2;
          bodySpineBase[i].y = CY+dy*1.2;
        }

        // Spawn tentacles from NEAREST body spine point to click
        const nearIdx = nearestBodySpineIdx(mx, my);
        const count = 2 + Math.floor(clickCount * 1.2);
        for (let i = 0; i < count; i++) {
          // Cluster around nearest point ±3 spine indices
          const si = Math.max(0, Math.min(bodySpine.length-1,
            nearIdx + Math.floor((Math.random()-0.5)*6)));
          spawnTentacle(bodySpine[si].x, bodySpine[si].y);
        }

        if (counterEl) {
          counterEl.textContent = clickCount + ' / 10';
          counterEl.classList.add('visible');
        }
        if (clickCount >= 10 && !redirecting) {
          redirecting = true;
          redirectTimer = Date.now();
        }
      });

      // ── Draw rings ──
      function drawRings(rings, visCount, color, sc, growT) {
        for (let r = 0; r < visCount; r++) {
          const u = r / rings.length;
          // Smooth growth: rings near the tip fade in smoothly
          let ringAlpha = 1;
          if (growT !== undefined && growT < 1) {
            const ringPos = r / rings.length;
            const fadeZone = 0.15;
            ringAlpha = Math.max(0, Math.min(1, (growT - ringPos + fadeZone) / fadeZone));
          }
          const cr = Math.min(255, Math.floor(color[0]*(1-u*0.3)));
          const cg = Math.min(255, Math.floor(color[1]*(1-u*0.2)));
          const cb = Math.min(255, Math.floor(color[2]*(1-u*0.1)));
          ctx.fillStyle = 'rgb('+cr+','+cg+','+cb+')';
          const ring = rings[r];
          for (let j = 0; j < ring.length; j++) {
            const p = ring[j];
            ctx.globalAlpha = Math.min(1, p.alpha * ringAlpha);
            ctx.font = Math.max(2, p.size*sc*ringAlpha)+'px "Courier New", monospace';
            ctx.fillText(p.glyph, p.x, p.y);
          }
        }
      }

      // ── Rebuild rings from spine ──
      function rebuildRings(rings, spine, baseR, taperEnd) {
        for (let r = 0; r < spine.length && r < rings.length; r++) {
          const u = r/(spine.length-1);
          const ringR = baseR*(1.0-u*taperEnd);
          let tx, ty;
          if (r < spine.length-1) { tx=spine[r+1].x-spine[r].x; ty=spine[r+1].y-spine[r].y; }
          else { tx=spine[r].x-spine[r-1].x; ty=spine[r].y-spine[r-1].y; }
          const tLen = Math.sqrt(tx*tx+ty*ty)||1;
          const nx=-ty/tLen, ny=tx/tLen;
          const tiltC = 0.3+Math.abs(ny)*0.5;
          const ring = rings[r];
          for (let j = 0; j < ring.length; j++) {
            const theta = (j/ring.length)*Math.PI*2;
            ring[j].baseX = spine[r].x + Math.cos(theta)*ringR*nx - Math.sin(theta)*ringR*tiltC*tx/tLen;
            ring[j].baseY = spine[r].y + Math.cos(theta)*ringR*ny - Math.sin(theta)*ringR*tiltC*ty/tLen;
          }
        }
      }

      // ══════════════════════════════════════
      //  ANIMATION
      // ══════════════════════════════════════
      function animate() {
        const t = Date.now()*0.001;
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // ── Animate body: multi-frequency irregular writhing ──
        for (let i = 0; i < bodySpine.length; i++) {
          const u = i/bodySpine.length;
          let wx = 0, wy = 0;
          for (let f = 0; f < wormPhases.length; f++) {
            const wp = wormPhases[f];
            wx += Math.sin(t*wp.freq + u*Math.PI*wp.spatialFreq + wp.phase) * wp.amp;
            wy += Math.cos(t*wp.freq*0.8 + u*Math.PI*(wp.spatialFreq*0.7) + wp.phase*1.3) * wp.amp*0.6;
          }
          bodySpine[i].x = bodySpineBase[i].x + wx*scaleMul;
          bodySpine[i].y = bodySpineBase[i].y + wy*scaleMul;
        }
        rebuildRings(bodyRings, bodySpine, 4*scaleMul, 0.7);

        // Update body ring points
        bodyRings.forEach(ring => ring.forEach(p => {
          p.x = p.baseX + Math.sin(t*p.speed+p.phase)*p.amp;
          p.y = p.baseY + Math.cos(t*p.speed*0.7+p.phase)*p.amp;
        }));

        const cr = Math.min(255, 220+clickCount*4);
        const cg = Math.max(20, 40-clickCount*3);
        const cb = Math.max(30, 50-clickCount*3);
        drawRings(bodyRings, bodyRings.length, [cr,cg,cb], Math.min(scaleMul, 2.5));

        // ── Animate & draw tentacles ──
        const now = Date.now();
        for (let ti = 0; ti < tentacles.length; ti++) {
          const ten = tentacles[ti];
          const growT = Math.min(1, (now-ten.birth)/ten.growDuration);

          // Wriggle spine
          for (let i = 0; i < ten.spine.length; i++) {
            const u = i/ten.spine.length;
            const wave = Math.sin(t*ten.wriggleFreq + u*Math.PI*5 + ten.wrigglePhase);
            const wave2 = Math.cos(t*ten.wriggleFreq*0.6 + u*Math.PI*3 + ten.wrigglePhase);
            ten.spine[i].x = ten.spineBase[i].x + wave*ten.wriggleAmp*u;
            ten.spine[i].y = ten.spineBase[i].y + wave2*ten.wriggleAmp*0.6*u;
          }
          rebuildRings(ten.rings, ten.spine, ten.baseR, 0.85);

          ten.rings.forEach(ring => ring.forEach(p => {
            p.x = p.baseX + Math.sin(t*p.speed+p.phase)*p.amp;
            p.y = p.baseY + Math.cos(t*p.speed*0.7+p.phase)*p.amp;
          }));

          const visRings = Math.ceil(ten.totalRings * growT);
          drawRings(ten.rings, visRings, ten.color, Math.min(scaleMul, 2.0), growT);
        }

        // ── Post-10-click transition ──
        if (redirecting) {
          const elapsed = (now-redirectTimer)/1000;
          if (elapsed < 3) {
            scaleMul += 0.01;
            if (Math.random() < 0.1) {
              const si = Math.floor(Math.random()*bodySpine.length);
              spawnTentacle(bodySpine[si].x, bodySpine[si].y);
            }
          } else if (elapsed < 5.5) {
            getAllPoints().forEach(p => {
              p.alpha = Math.max(0, p.alpha-0.003);
              const dx=p.baseX-CX, dy=p.baseY-CY;
              const dist = Math.sqrt(dx*dx+dy*dy)||1;
              p.baseX += (dx/dist)*2; p.baseY += (dy/dist)*2;
            });
            bodySpineBase.forEach(p => {
              const dx=p.x-CX, dy=p.y-CY;
              const dist = Math.sqrt(dx*dx+dy*dy)||1;
              p.x += (dx/dist)*1.5; p.y += (dy/dist)*1.5;
            });
            tentacles.forEach(ten => ten.spineBase.forEach(p => {
              const dx=p.x-CX, dy=p.y-CY;
              const dist = Math.sqrt(dx*dx+dy*dy)||1;
              p.x += (dx/dist)*2; p.y += (dy/dist)*2;
            }));
          } else {
            window.location.href = 'play.html';
            return;
          }
        }

        ctx.globalAlpha = 1;

        // ── Orbit curves (merged into single rAF loop) ──
        if (orbitCtx && orbitPts) {
          var ow = orbitW, oh = orbitH;
          orbitCtx.clearRect(0, 0, ow, oh);

          // Batch by color: main curves vs stray wires
          orbitCtx.textAlign = 'center';
          orbitCtx.textBaseline = 'middle';
          orbitCtx.fillStyle = 'rgb(184,184,208)';
          for (var oi = 0; oi < orbitPts.length; oi++) {
            var op = orbitPts[oi];
            if (op.ci >= 4) continue;
            orbitCtx.globalAlpha = op.alpha;
            orbitCtx.font = op.font;
            orbitCtx.fillText(op.glyph,
              op.nx*ow + Math.sin(t*op.speed+op.phase)*op.amp,
              op.ny*oh + Math.cos(t*op.speed*0.7+op.phase)*op.amp);
          }
          orbitCtx.fillStyle = 'rgba(184,184,208,0.6)';
          for (var oi = 0; oi < orbitPts.length; oi++) {
            var op = orbitPts[oi];
            if (op.ci < 4) continue;
            orbitCtx.globalAlpha = op.alpha;
            orbitCtx.font = op.font;
            orbitCtx.fillText(op.glyph,
              op.nx*ow + Math.sin(t*op.speed+op.phase)*op.amp,
              op.ny*oh + Math.cos(t*op.speed*0.7+op.phase)*op.amp);
          }

          // Shimmer
          orbitCtx.fillStyle = 'rgb(210,150,150)';
          for (var si = 0; si < shimmerPts.length; si++) {
            var sp = shimmerPts[si];
            sp.progress = (sp.progress + sp.speed*0.016) % 1;
            var totalSegs = sp.segs.length;
            var gT = sp.progress * totalSegs;
            var segI = Math.min(Math.floor(gT), totalSegs-1);
            var lT = gT - segI;
            var s = sp.segs[segI];
            var u2 = 1-lT;
            var px = u2*u2*u2*s.p0.x + 3*u2*u2*lT*s.p1.x + 3*u2*lT*lT*s.p2.x + lT*lT*lT*s.p3.x;
            var py = u2*u2*u2*s.p0.y + 3*u2*u2*lT*s.p1.y + 3*u2*lT*lT*s.p2.y + lT*lT*lT*s.p3.y;
            orbitCtx.globalAlpha = sp.alpha;
            orbitCtx.font = sp.font;
            orbitCtx.fillText(sp.glyph, px*ow, py*oh);
          }
          orbitCtx.globalAlpha = 1;
        }

        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
